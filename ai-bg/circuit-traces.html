<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Circuit Traces — AI GREEN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000000}
canvas{display:block;width:100%;height:100%}
.badge{position:fixed;top:14px;left:14px;z-index:2;display:flex;flex-direction:column;gap:2px;padding:9px 12px;background:hsla(0 0% 0% / 0.62);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid hsla(142 76% 50% / 0.22);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;max-width:min(88vw,380px)}
.badge b{font-size:11px;letter-spacing:0.14em;color:hsl(142 76% 50%);font-weight:700;line-height:1}
.badge span{font-size:11px;color:hsla(142 76% 50% / 0.72);line-height:1.35;letter-spacing:0.02em}
.nav{position:fixed;top:14px;right:14px;z-index:2;padding:7px 12px;background:hsla(142 76% 50% / 0.12);border:1px solid hsla(142 76% 50% / 0.28);color:hsl(142 76% 50%);font-family:ui-monospace,monospace;font-size:11px;letter-spacing:0.08em;text-decoration:none;transition:background .15s}
.nav:hover{background:hsla(142 76% 50% / 0.22)}
.foot{position:fixed;bottom:10px;right:14px;z-index:2;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:0.12em;color:hsla(142 76% 50% / 0.55);display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.foot-nav{display:inline-flex;align-items:center;gap:6px;margin-left:4px}
.foot-nav a{display:inline-block;padding:2px 8px;border:1px solid hsla(142 76% 50% / 0.18);border-radius:999px;color:hsl(142 76% 50%);text-decoration:none;background:hsla(142 76% 50% / 0.07);transition:background .15s,border-color .15s,opacity .15s;font-size:10px;letter-spacing:0.08em}
.foot-nav a:hover{background:hsla(142 76% 50% / 0.18);border-color:hsla(142 76% 50% / 0.36)}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 120% at 50% 50%, transparent 55%, #000 88%)}
.vignette::after{content:'';position:absolute;inset:0;background:linear-gradient(to right,#000 0%,transparent 12%,transparent 88%,#000 100%),linear-gradient(to bottom,#000 0%,transparent 14%,transparent 86%,#000 100%);opacity:0.42}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vignette"></div>
<div class="badge"><b>Circuit Traces</b><span>PCB traces lighting up at random</span></div>
<a class="nav" href="./index.html">← Gallery</a>
<div class="foot">05 / 11 · circuit-traces · hsl(142 76% 50%) on #000<span class="foot-nav"><a href="./grid-wave.html">← Prev</a> · <a href="./data-stream.html">Next →</a></span></div>
<script>
(() => {
let prefersReducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
const _motionMql = matchMedia('(prefers-reduced-motion: reduce)');
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d',{alpha:false,desynchronized:true});
let W,H,DPR;
const GREEN='hsl(142 76% 50%)';
let traces=[];
const COUNT=18;
const GRID=24;
const rnd=(a,b)=>a+Math.random()*(b-a);
const snap=(v,g)=>Math.round(v/g)*g;

function build(){
  traces=[];
  const cols=Math.floor(W/GRID), rows=Math.floor(H/GRID);
  for(let i=0;i<COUNT;i++){
    // start away from UI chrome
    let x0,y0;
    let guard=0;
    do{
      x0=snap(rnd(GRID*2, W-GRID*2), GRID);
      y0=snap(rnd(GRID*3, H-GRID*3), GRID);
      guard++;
    }while(guard<8 && ((x0<260 && y0<82) || (x0>W-170 && y0<68)));
    const pts=[{x:x0,y:y0}];
    let cx=x0, cy=y0;
    let horiz=Math.random()<0.5;
    const segs=2+Math.floor(Math.random()*4); // 2..5 bends => 3..6 pts
    for(let s=0;s<segs;s++){
      const lenPx=horiz ? rnd(GRID*3, W*0.22) : rnd(GRID*3, H*0.20);
      const len=snap(Math.max(GRID*2, lenPx), GRID);
      let dir=Math.random()<0.5?1:-1;
      if(horiz){
        let nx=cx+dir*len;
        if(nx<GRID || nx>W-GRID){
          nx=cx-dir*len;
          nx=Math.max(GRID,Math.min(W-GRID,nx));
          if(Math.abs(nx-cx)<GRID) continue;
        }
        nx=snap(nx,GRID); cx=nx;
      }else{
        let ny=cy+dir*len;
        if(ny<GRID*2 || ny>H-GRID*2){
          ny=cy-dir*len;
          ny=Math.max(GRID*2,Math.min(H-GRID*2,ny));
          if(Math.abs(ny-cy)<GRID) continue;
        }
        ny=snap(ny,GRID); cy=ny;
      }
      pts.push({x:cx,y:cy});
      horiz=!horiz;
    }
    if(pts.length<3) { i--; continue; }
    let total=0;
    for(let k=1;k<pts.length;k++) total+=Math.abs(pts[k].x-pts[k-1].x)+Math.abs(pts[k].y-pts[k-1].y);
    if(total<GRID*4){ i--; continue; }
    traces.push({
      pts,
      total,
      speed:0.18+Math.random()*0.34,
      offset:(i*0.072 + Math.random()*0.18)%1,
      durJitter: rnd(0.92,1.08)
    });
  }
}

function resize(){
  DPR=Math.min(window.devicePixelRatio||1,2);
  W=innerWidth;H=innerHeight;
  canvas.width=Math.round(W*DPR);
  canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px';
  canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  build();
}
addEventListener('resize',resize);
resize();

function pointAlong(pts, t){
  let total=0;
  for(let i=1;i<pts.length;i++) total+=Math.abs(pts[i].x-pts[i-1].x)+Math.abs(pts[i].y-pts[i-1].y);
  let target=t*total, acc=0;
  for(let i=1;i<pts.length;i++){
    const seg=Math.abs(pts[i].x-pts[i-1].x)+Math.abs(pts[i].y-pts[i-1].y);
    if(acc+seg>=target){
      const u=(target-acc)/seg;
      return {x:pts[i-1].x+(pts[i].x-pts[i-1].x)*u, y:pts[i-1].y+(pts[i].y-pts[i-1].y)*u};
    }
    acc+=seg;
  }
  return pts[pts.length-1];
}

function strokePartial(pts, t1, t2, width, style, blur){
  if(t2<=t1) return;
  let total=0;
  for(let i=1;i<pts.length;i++) total+=Math.abs(pts[i].x-pts[i-1].x)+Math.abs(pts[i].y-pts[i-1].y);
  const a=t1*total, b=t2*total;
  let acc=0;
  let started=false;
  ctx.beginPath();
  for(let i=1;i<pts.length;i++){
    const ax=pts[i-1].x, ay=pts[i-1].y, bx=pts[i].x, by=pts[i].y;
    const seg=Math.abs(bx-ax)+Math.abs(by-ay);
    const segA=acc, segB=acc+seg;
    if(segB<a || segA>b){ acc+=seg; continue; }
    const s=Math.max(a,segA), e=Math.min(b,segB);
    const u0=(s-segA)/seg, u1=(e-segA)/seg;
    const x0=ax+(bx-ax)*u0, y0=ay+(by-ay)*u0;
    const x1=ax+(bx-ax)*u1, y1=ay+(by-ay)*u1;
    if(!started){ ctx.moveTo(x0,y0); started=true; }
    else ctx.lineTo(x0,y0);
    ctx.lineTo(x1,y1);
    acc+=seg;
  }
  if(!started) return;
  ctx.strokeStyle=style;
  ctx.lineWidth=width;
  ctx.lineCap='round';
  ctx.lineJoin='round';
  ctx.shadowBlur=blur||0;
  if(blur) ctx.shadowColor=GREEN;
  ctx.stroke();
  ctx.shadowBlur=0;
}

let raf=0;
let paused = document.hidden;

function drawStatic(){
  ctx.fillStyle='#000'; ctx.fillRect(0,0,W,H);
  for(const tr of traces){
    // dim base
    ctx.beginPath(); ctx.moveTo(tr.pts[0].x,tr.pts[0].y);
    for(let i=1;i<tr.pts.length;i++) ctx.lineTo(tr.pts[i].x,tr.pts[i].y);
    ctx.strokeStyle='hsla(142 76% 50% / 0.11)'; ctx.lineWidth=2; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.stroke();
    for(const pt of tr.pts){
      const isEnd=pt===tr.pts[0]||pt===tr.pts[tr.pts.length-1];
      ctx.beginPath(); ctx.arc(pt.x,pt.y,isEnd?4:2,0,Math.PI*2);
      ctx.fillStyle=isEnd?GREEN:'hsla(142 76% 50% / 0.6)'; ctx.fill();
      if(isEnd){ ctx.beginPath(); ctx.arc(pt.x,pt.y,8,0,Math.PI*2); ctx.fillStyle='hsla(142 76% 50% / 0.09)'; ctx.fill(); }
    }
  }
}

function frame(t){
  if (paused) return;
  if (prefersReducedMotion) { drawStatic(); return; }
  const time=t*0.001;
  ctx.fillStyle='#000';
  ctx.fillRect(0,0,W,H);

  // faint grid dots — PCB drill markers
  ctx.fillStyle='hsla(142 76% 50% / 0.038)';
  const step=28;
  for(let x=step;x<W;x+=step){
    for(let y=step;y<H;y+=step){
      ctx.beginPath(); ctx.arc(x,y,0.85,0,Math.PI*2); ctx.fill();
    }
  }

  for(const tr of traces){
    // dim idle trace (full length, hairline, no glow)
    ctx.beginPath();
    ctx.moveTo(tr.pts[0].x,tr.pts[0].y);
    for(let i=1;i<tr.pts.length;i++) ctx.lineTo(tr.pts[i].x,tr.pts[i].y);
    ctx.strokeStyle='hsla(142 76% 50% / 0.085)'; ctx.lineWidth=1.4; ctx.lineCap='round'; ctx.lineJoin='round'; ctx.stroke();
  }

  for(const tr of traces){
    let pos=((time*tr.speed*tr.durJitter+tr.offset)%1);
    if(pos<0) pos+=1;

    // sequential light-up: draw grows to pulse head, then holds, then fades
    let progress, alpha=1, showPulse=true;
    if(pos<0.58){
      progress=pos/0.58;
    }else if(pos<0.74){
      progress=1;
    }else if(pos<0.9){
      progress=1;
      alpha=1-(pos-0.74)/0.16;
      if(alpha<0.02) continue;
    }else{
      // gap — trace dark between cycles
      showPulse=false;
      progress=0; alpha=0;
      // still keep vias/pads dim (already drawn)
      // draw dim pads only
      for(let i=0;i<tr.pts.length;i++){
        const pt=tr.pts[i];
        const isEnd=i===0||i===tr.pts.length-1;
        ctx.beginPath(); ctx.arc(pt.x,pt.y,isEnd?3.2:1.6,0,Math.PI*2);
        ctx.fillStyle=isEnd?'hsla(142 76% 50% / 0.42)':'hsla(142 76% 50% / 0.2)';
        ctx.fill();
      }
      continue;
    }

    // lit portion [0 .. progress] — outer halo + mid glow + 2px core
    if(progress>0.001){
      // halo 10px very faint
      strokePartial(tr.pts, 0, progress, 10, 'hsla(142 76% 50% / 0.07)', 0);
      // mid glow 5.5px + shadow
      strokePartial(tr.pts, 0, progress, 5.4, `hsla(142 76% 50% / ${0.22*alpha})`, 14);
      // core 2px spec + soft glow
      strokePartial(tr.pts, 0, progress, 2, `hsla(142 76% 50% / ${Math.max(0.42, alpha)})`, 8);
    }

    // via dots + pads — light up as pulse passes each vertex
    for(let i=0;i<tr.pts.length;i++){
      const pt=tr.pts[i];
      const isEnd=i===0||i===tr.pts.length-1;
      // distance to this vertex
      let dist=0;
      for(let k=1;k<=i;k++) dist+=Math.abs(tr.pts[k].x-tr.pts[k-1].x)+Math.abs(tr.pts[k].y-tr.pts[k-1].y);
      const vProg=dist/tr.total;
      const lit=progress>=vProg;
      if(isEnd){
        const r=5.8;
        if(lit){
          ctx.shadowColor=GREEN; ctx.shadowBlur=12;
          ctx.beginPath(); ctx.arc(pt.x,pt.y,r,0,Math.PI*2);
          ctx.fillStyle=`hsla(142 76% 50% / ${0.18*alpha})`; ctx.fill();
          ctx.shadowBlur=0;
          ctx.beginPath(); ctx.arc(pt.x,pt.y,3.8,0,Math.PI*2);
          ctx.fillStyle=GREEN; ctx.fill();
          ctx.beginPath(); ctx.arc(pt.x,pt.y,1.25,0,Math.PI*2);
          ctx.fillStyle='hsla(142 76% 50% / 0.95)'; ctx.fill();
          ctx.beginPath(); ctx.arc(pt.x,pt.y,3.8,0,Math.PI*2);
          ctx.strokeStyle=`hsla(142 76% 50% / ${0.55*alpha})`; ctx.lineWidth=1.1; ctx.stroke();
        }else{
          ctx.shadowBlur=0;
          ctx.beginPath(); ctx.arc(pt.x,pt.y,3.2,0,Math.PI*2);
          ctx.fillStyle='hsla(142 76% 50% / 0.22)'; ctx.fill();
          ctx.beginPath(); ctx.arc(pt.x,pt.y,3.2,0,Math.PI*2);
          ctx.strokeStyle='hsla(142 76% 50% / 0.16)'; ctx.lineWidth=1; ctx.stroke();
        }
      }else{
        if(lit){
          ctx.shadowColor=GREEN; ctx.shadowBlur=8;
          ctx.beginPath(); ctx.arc(pt.x,pt.y,2.15,0,Math.PI*2);
          ctx.fillStyle=GREEN; ctx.fill();
          ctx.shadowBlur=0;
          ctx.beginPath(); ctx.arc(pt.x,pt.y,4.2,0,Math.PI*2);
          ctx.strokeStyle=`hsla(142 76% 50% / ${0.16*alpha})`; ctx.lineWidth=1; ctx.stroke();
        }else{
          ctx.shadowBlur=0;
          ctx.beginPath(); ctx.arc(pt.x,pt.y,1.75,0,Math.PI*2);
          ctx.fillStyle='hsla(142 76% 50% / 0.28)'; ctx.fill();
        }
      }
    }

    // traveling energy pulse head + tail streak
    if(showPulse && pos<0.58 && progress>0.01){
      const head=pointAlong(tr.pts, progress);
      // tail segment ~28px behind head
      const tailT=Math.max(0, progress - 30/tr.total);
      // gradient tail
      const tailP=pointAlong(tr.pts, tailT);
      // only draw tail if not wrapping over a corner with zero length
      const g=ctx.createLinearGradient(tailP.x,tailP.y,head.x,head.y);
      g.addColorStop(0,'hsla(142 76% 50% / 0)');
      g.addColorStop(0.5,'hsla(142 76% 50% / 0.28)');
      g.addColorStop(1,`hsla(142 76% 50% / ${0.92*alpha})`);
      strokePartial(tr.pts, tailT, progress, 2, g, 0);

      // head core dot
      ctx.shadowColor=GREEN; ctx.shadowBlur=14;
      ctx.beginPath(); ctx.arc(head.x,head.y,3.35,0,Math.PI*2);
      ctx.fillStyle=`hsla(142 76% 50% / ${0.98*alpha})`; ctx.fill();
      ctx.shadowBlur=0;
      ctx.beginPath(); ctx.arc(head.x,head.y,1.35,0,Math.PI*2);
      ctx.fillStyle=`hsla(142 76% 30% / ${0.92*alpha})`; ctx.fill();
      // outer ring
      ctx.beginPath(); ctx.arc(head.x,head.y,7.2,0,Math.PI*2);
      ctx.strokeStyle=`hsla(142 76% 50% / ${0.18*alpha})`; ctx.lineWidth=1; ctx.stroke();
    }

    // arrival flash when trace just finished filling
    if(pos>=0.58 && pos<0.66){
      const p=tr.pts[tr.pts.length-1];
      const pulse=Math.sin((pos-0.58)/0.08*Math.PI);
      ctx.shadowColor=GREEN; ctx.shadowBlur=16*pulse;
      ctx.beginPath(); ctx.arc(p.x,p.y, 9+5*pulse, 0, Math.PI*2);
      ctx.fillStyle=`hsla(142 76% 50% / ${0.13*pulse*alpha})`; ctx.fill();
      ctx.shadowBlur=0;
    }
  }

  raf=requestAnimationFrame(frame);
}

if(prefersReducedMotion){
  drawStatic();
}else{
  raf=requestAnimationFrame(frame);
}

_motionMql.addEventListener('change', (e) => {
  prefersReducedMotion = e.matches;
  if (e.matches) {
    cancelAnimationFrame(raf);
    drawStatic();
  } else {
    if (!document.hidden) raf=requestAnimationFrame(frame);
  }
});

document.addEventListener('visibilitychange',()=>{
  paused = document.hidden;
  if(document.hidden) cancelAnimationFrame(raf);
  else if(!prefersReducedMotion) raf=requestAnimationFrame(frame);
});
})();
</script>
</body>
</html>
