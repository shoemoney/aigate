<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Matrix Rain — AI GREEN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000000}
canvas{display:block;width:100%;height:100%;background:#000000}
.badge{position:fixed;top:14px;left:14px;z-index:2;display:flex;flex-direction:column;gap:2px;padding:9px 12px;background:hsla(0 0% 0% / 0.62);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border:1px solid hsla(142 76% 50% / 0.25);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.badge b{font-size:11px;letter-spacing:0.14em;color:hsl(142 76% 50%);font-weight:700;line-height:1}
.badge span{font-size:10px;letter-spacing:0.04em;color:hsla(142 76% 50% / 0.7);line-height:1.4}
.nav{position:fixed;top:14px;right:14px;z-index:2;padding:7px 12px;background:hsla(142 76% 50% / 0.12);border:1px solid hsla(142 76% 50% / 0.28);color:hsl(142 76% 50%);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:0.08em;text-decoration:none;transition:background .15s}
.nav:hover{background:hsla(142 76% 50% / 0.22)}
.foot{position:fixed;bottom:10px;right:14px;z-index:2;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;letter-spacing:0.12em;color:hsla(142 76% 50% / 0.55);display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.foot-nav{display:inline-flex;gap:6px;align-items:center}
.foot-nav a{display:inline-block;padding:3px 8px;border:1px solid hsla(142 76% 50% / 0.18);color:hsla(142 76% 50% / 0.75);text-decoration:none;border-radius:999px;font-size:10px;letter-spacing:0.08em;transition:background .15s,border-color .15s,color .15s}
.foot-nav a:hover{background:hsla(142 76% 50% / 0.12);border-color:hsla(142 76% 50% / 0.35);color:hsl(142 76% 50%)}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(115% 115% at 50% 50%, transparent 58%, #000000 88%)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vignette"></div>
<div class="badge"><b>Matrix Rain</b><span>Falling glyphs in 50% green light</span></div>
<a class="nav" href="./index.html">← Gallery</a>
<div class="foot">02 / 11 · matrix-rain · hsl(142 76% 50%) on #000 <span class="foot-nav"><a href="./neural-network.html">← Prev</a> · <a href="./particle-field.html">Next →</a></span></div>
<script>
const prefersReducedMotionQuery = matchMedia('(prefers-reduced-motion: reduce)');
let prefersReducedMotion = prefersReducedMotionQuery.matches;
let rafId = null;
let paused = document.hidden;

const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,DPR;
const GLYPHS=['0','1','⊏','⊐','⟨','⟩','◆','◇'];
const COLS=40;
let drops=[];

function randGlyph(){ return GLYPHS[(Math.random()*GLYPHS.length)|0]; }

function makeDrops(){
  drops=[];
  for(let i=0;i<COLS;i++){
    const len=10+((Math.random()*10)|0); // 10-19 trail length
    const speed=0.9 + Math.random()*2.8; // varying speeds
    drops.push({
      xN: (i+0.5)/COLS, // normalized 0-1 so resize preserves layout
      y: Math.random()*H - Math.random()*900 - 80, // staggered start, many off-screen above
      len, speed,
      chars: Array.from({length:len}, randGlyph),
      intensify: 0, // frames remaining for bright burst
      jitter: (Math.random()-0.5)*0.6 // slight x wobble per column
    });
  }
}

function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  canvas.width=Math.round(W*DPR); canvas.height=Math.round(H*DPR);
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  // rebuild only if empty or column xN missing
  if(drops.length!==COLS) makeDrops();
}
makeDrops();
resize();
addEventListener('resize', resize);

// monospace metrics
const FONT_SIZE=15;
const LINE_H=18; // vertical spacing between glyphs

let t=0;
function frame(){
  if(paused) return;
  t++;
  // pure black clear — trail fade is per-glyph alpha, not canvas ghost
  ctx.clearRect(0,0,W,H);
  // slight fill to ensure pure black (clearRect already does it, but explicit)
  // ctx.fillStyle='#000000'; ctx.fillRect(0,0,W,H);

  ctx.textAlign='center';
  ctx.textBaseline='middle';

  for(let ci=0;ci<COLS;ci++){
    const d=drops[ci];
    // advance head
    d.y += d.speed;

    // occasionally intensify this column (≈1% chance/frame → ~0.4 cols/frame)
    if(d.intensify<=0 && Math.random()<0.006){
      d.intensify = 14 + ((Math.random()*16)|0); // 14-30 frames
    }
    if(d.intensify>0) d.intensify--;

    // occasionally mutate a trail char
    if(Math.random()<0.035){
      const ri=(Math.random()*d.len)|0;
      d.chars[ri]=randGlyph();
    }
    // head char mutates more often
    if(Math.random()<0.08) d.chars[0]=randGlyph();

    // recycle when completely off-screen
    if(d.y - d.len*LINE_H > H + 40){
      d.y = -d.len*LINE_H - Math.random()*320;
      d.len = 10+((Math.random()*10)|0);
      d.speed = 0.9 + Math.random()*2.8;
      d.chars = Array.from({length:d.len}, randGlyph);
      d.intensify = 0;
    }

    const x = d.xN*W + d.jitter;
    const boost = d.intensify>0 ? 1 : 0;
    // burst alpha boost peaks mid-burst
    const burstMul = d.intensify>0 ? (0.35 + 0.25*Math.sin((d.intensify/22)*Math.PI)) : 0;

    for(let i=0;i<d.len;i++){
      const y = d.y - i*LINE_H;
      if(y < -16 || y > H+16) continue;

      // alpha: head bright → trail fades to transparent
      let a;
      if(i===0) a=1.0;
      else if(i===1) a=0.52;
      else if(i===2) a=0.30;
      else if(i===3) a=0.18;
      else a=Math.max(0, 0.16 * Math.pow(0.78, i-4));
      // intensify lifts entire column
      if(boost) a=Math.min(1, a + burstMul);
      // also enforce spec's 0.5 opacity variant usage on mid-trail
      // (mid trail naturally hits ~0.5 and ~0.18 via the curve above)

      if(a < 0.015) continue;

      const isHead = i===0;
      const size = isHead ? FONT_SIZE : (FONT_SIZE-1 - Math.min(2, i*0.08));
      ctx.font=`${size}px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace`;

      const ch = d.chars[i] || randGlyph();

      if(isHead){
        // bright head with green glow — only hues are hsl(142 76% 50%)
        ctx.shadowColor='hsl(142 76% 50%)';
        ctx.shadowBlur= boost ? 16 : 10;
        ctx.fillStyle=`hsla(142 76% 50% / ${Math.min(1,a)})`;
        ctx.fillText(ch, x, y);
        ctx.shadowBlur=0;
        // extra core highlight dot for head
        if(a>0.8){
          ctx.fillStyle=`hsla(142 76% 50% / ${0.95})`;
          // tiny inner bright — same hue, just fuller opacity
        }
      } else {
        ctx.fillStyle=`hsla(142 76% 50% / ${a})`;
        ctx.fillText(ch, x, y);
      }
    }
  }
  if(!prefersReducedMotion && !paused){
    rafId = requestAnimationFrame(frame);
  }
}

if(prefersReducedMotion){
  frame();
} else {
  rafId = requestAnimationFrame(frame);
}

prefersReducedMotionQuery.addEventListener('change', (e) => {
  prefersReducedMotion = e.matches;
  if(prefersReducedMotion){
    if(rafId) cancelAnimationFrame(rafId);
    rafId = null;
  } else if(!paused){
    if(!rafId) rafId = requestAnimationFrame(frame);
  }
});

document.addEventListener('visibilitychange', () => {
  paused = document.hidden;
  if(paused){
    if(rafId) cancelAnimationFrame(rafId);
    rafId = null;
  } else if(!prefersReducedMotion){
    if(!rafId) rafId = requestAnimationFrame(frame);
  }
});
</script>
</body>
</html>
