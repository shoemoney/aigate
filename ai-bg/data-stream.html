<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Data Stream — AI GREEN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%}
.badge{position:fixed;top:14px;left:14px;z-index:2;display:flex;align-items:center;gap:10px;padding:8px 12px;background:hsla(0 0% 0% / 0.6);backdrop-filter:blur(8px);border:1px solid hsla(142 76% 50% / 0.25);font-family:ui-monospace,monospace}
.badge b{font-size:11px;letter-spacing:0.14em;color:hsl(142 76% 50%);font-weight:700}
.badge span{font-size:11px;color:hsla(142 76% 50% / 0.65)}
.nav{position:fixed;top:14px;right:14px;z-index:2;padding:7px 12px;background:hsla(142 76% 50% / 0.12);border:1px solid hsla(142 76% 50% / 0.28);color:hsl(142 76% 50%);font-family:ui-monospace,monospace;font-size:11px;letter-spacing:0.08em;text-decoration:none}
.nav:hover{background:hsla(142 76% 50% / 0.22)}
.foot{position:fixed;bottom:10px;right:14px;z-index:2;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:0.12em;color:hsla(142 76% 50% / 0.55)}
.foot-nav{display:inline-flex;gap:8px;align-items:center}
.foot-nav a{color:hsl(142 76% 50%);text-decoration:none;border:1px solid hsla(142 76% 50% / 0.18);padding:2px 8px;border-radius:999px;font-size:10px;letter-spacing:0.08em}
.foot-nav a:hover{border-color:hsla(142 76% 50% / 0.4);background:hsla(142 76% 50% / 0.08)}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 120% at 50% 50%, transparent 55%, #000 88%)}
.scan{position:fixed;inset:0;pointer-events:none;opacity:1;background:repeating-linear-gradient(to bottom, transparent 0px, transparent 2px, hsla(142 76% 50% / 0.035) 2px, hsla(142 76% 50% / 0.035) 3px)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="scan"></div>
<div class="vignette"></div>
<div class="badge"><b>DATA STREAM</b><span>Horizontal data bars flowing to infinity</span></div>
<a class="nav" href="./index.html">← Gallery</a>
<div class="foot"><span>06 / 11 · data-stream · hsl(142 76% 50%) on #000</span><span class="foot-nav"><a href="./circuit-traces.html">← Prev</a> · <a href="./hex-mesh.html">Next →</a></span></div>
<script>
let prefersReducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let rafId=null, paused=document.hidden;
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,DPR;
const LANES=8;
let laneH=14, laneGap=26, laneTops=[], laneCenters=[];
let packets=[];
let lastT=performance.now();
let nextSpawnPerLane=[];
let nextBurstAt=0;

function layout(){
  // responsive lane sizing
  laneH = H < 500 ? 10 : H < 700 ? 12 : 14;
  laneGap = H < 500 ? 16 : H < 700 ? 20 : 26;
  const total = LANES*laneH + (LANES-1)*laneGap;
  const topPad = Math.max(72, (H - total)/2);
  laneTops.length=0; laneCenters.length=0;
  for(let i=0;i<LANES;i++){
    const y = topPad + i*(laneH+laneGap);
    laneTops.push(y);
    laneCenters.push(y+laneH/2);
  }
}

function resize(){
  DPR=Math.min(devicePixelRatio||1,2);
  W=innerWidth; H=innerHeight;
  canvas.width=W*DPR; canvas.height=H*DPR;
  canvas.style.width=W+'px'; canvas.style.height=H+'px';
  ctx.setTransform(DPR,0,0,DPR,0,0);
  layout();
}
addEventListener('resize',()=>{ resize(); });

function rnd(a,b){ return a+Math.random()*(b-a); }

function makePacket(lane, xOverride){
  const isWide = Math.random()<0.18;
  const w = isWide ? rnd(110,175) : rnd(22,92);
  const speed = rnd(55,210);
  // subtle variation: wider packets slightly slower on average
  const adjSpeed = isWide ? speed*0.78 : speed;
  const x = (xOverride!==undefined)? xOverride : -w - rnd(0, 220);
  const bright = rnd(0.72,1);
  return { lane, x, w, h: laneH, speed: adjSpeed, bright, tail: rnd(22,44) };
}

function init(){
  packets=[];
  nextSpawnPerLane=[];
  const now=performance.now();
  for(let i=0;i<LANES;i++){
    nextSpawnPerLane[i]=now+rnd(0,700);
    // prefill each lane with 2-5 packets spread across viewport
    const count = 2+Math.floor(Math.random()*4);
    for(let k=0;k<count;k++){
      const p=makePacket(i, rnd(-W*0.2, W*0.9));
      // give prefills a random head start so they aren't clustered left
      p.x = rnd(-120, W-40);
      if(p.x + p.w < 0) p.x = rnd(0, W*0.6);
      packets.push(p);
    }
  }
  nextBurstAt = now + rnd(900,2200);
}

resize();
init();

// spawn helpers
function trySpawns(now){
  for(let lane=0; lane<LANES; lane++){
    if(now >= nextSpawnPerLane[lane]){
      // don't spawn if lane's trailing packet is still too close to left edge busy
      packets.push(makePacket(lane));
      nextSpawnPerLane[lane]=now+rnd(260,980);
      // occasional double spawn for density without being a burst
      if(Math.random()<0.12){
        const p2=makePacket(lane, -rnd(0,60));
        packets.push(p2);
      }
    }
  }
  if(now >= nextBurstAt){
    const burstLane = Math.floor(Math.random()*LANES);
    const burstCount = 7+Math.floor(Math.random()*6);
    // dense train: packets tightly spaced moving together
    let cursor = -rnd(10,40);
    const burstSpeed = rnd(95,175);
    for(let i=0;i<burstCount;i++){
      const w = rnd(28,78);
      const gap = rnd(8,22);
      cursor -= (w + gap);
      const p = makePacket(burstLane, cursor);
      p.w = w;
      p.speed = burstSpeed + rnd(-14,14);
      p.bright = rnd(0.85,1);
      packets.push(p);
    }
    // also nudge next spawns for that lane outward so burst stays dense visually
    nextSpawnPerLane[burstLane]=now+rnd(900,1600);
    nextBurstAt = now + rnd(2100,4200);
  }
}

function drawLaneTracks(){
  // subtle track bg per lane
  for(let i=0;i<LANES;i++){
    const y=laneTops[i];
    // track fill
    ctx.fillStyle='hsla(142 76% 50% / 0.04)';
    ctx.fillRect(0, y, W, laneH);
    // inner thin centre line hint
    ctx.fillStyle='hsla(142 76% 50% / 0.025)';
    ctx.fillRect(0, y+laneH/2-0.5, W, 1);
  }
  // lane dividers (between lanes)
  ctx.fillStyle='hsla(142 76% 50% / 0.09)';
  for(let i=0;i<LANES-1;i++){
    const y = laneTops[i]+laneH + laneGap/2;
    ctx.fillRect(0, y-0.5, W, 1);
  }
  // outer border lines
  ctx.fillStyle='hsla(142 76% 50% / 0.07)';
  ctx.fillRect(0, laneTops[0]-1, W, 1);
  ctx.fillRect(0, laneTops[LANES-1]+laneH, W, 1);
}

function drawPacket(p){
  const y=laneTops[p.lane];
  const x=p.x;
  const w=p.w;
  const h=p.h;
  const r=2;
  // trailing glow gradient (left tail)
  const tailLen = p.tail + w*0.55;
  const gx0 = x - tailLen;
  const gx1 = x + w;
  // clamp gradient to visible
  if(gx1 < -30 || gx0 > W+30) return;
  const grad=ctx.createLinearGradient(gx0,0,gx1,0);
  grad.addColorStop(0,'hsla(142 76% 50% / 0)');
  grad.addColorStop(0.35,'hsla(142 76% 50% / 0.06)');
  grad.addColorStop(0.65,'hsla(142 76% 50% / 0.13)');
  grad.addColorStop(0.88,'hsla(142 76% 50% / 0.22)');
  grad.addColorStop(1,'hsla(142 76% 50% / 0.45)');
  // glow body (slightly larger, more transparent)
  ctx.fillStyle=grad;
  // draw tail + packet as one gradient rect with rounded left is not needed, use plain rect
  // subtle expanded height for glow bleed
  ctx.fillRect(Math.max(gx0, -8), y-1, Math.min(gx1, W+8)-Math.max(gx0,-8), h+2);

  // core packet
  // use roundRect if available
  const alpha = 0.55 + p.bright*0.45;
  ctx.fillStyle=`hsla(142 76% 50% / ${alpha})`;
  // mimic shadow glow without shadowBlur (perf): draw a second fatter rect behind at lower alpha
  ctx.fillStyle=`hsla(142 76% 50% / ${0.14 * p.bright})`;
  ctx.fillRect(x-2, y-2, w+4, h+4);
  ctx.fillStyle=`hsla(142 76% 50% / ${alpha})`;
  if(ctx.roundRect){
    ctx.beginPath();
    ctx.roundRect(x, y, w, h, r);
    ctx.fill();
    // leading edge highlight (bright front)
    ctx.fillStyle='hsla(142 76% 50% / 0.95)';
    ctx.beginPath();
    ctx.roundRect(x+w-2, y, 2.5, h, 1);
    ctx.fill();
  } else {
    ctx.fillRect(x, y, w, h);
    ctx.fillStyle='hsla(142 76% 50% / 0.95)';
    ctx.fillRect(x+w-2.5, y, 2.5, h);
  }
}

function drawStaticFrame(){
  ctx.clearRect(0,0,W,H);
  drawLaneTracks();
  for(let i=0;i<packets.length;i++) drawPacket(packets[i]);
}

function frame(now){
  if(prefersReducedMotion) return;
  if(paused) return;
  const dt = Math.min(0.05, (now-lastT)/1000);
  lastT=now;

  // update
  trySpawns(now);
  for(let i=packets.length-1;i>=0;i--){
    const p=packets[i];
    p.x += p.speed * dt;
    if(p.x > W+60){
      packets.splice(i,1);
    }
  }

  // draw
  ctx.clearRect(0,0,W,H);
  drawLaneTracks();

  // packets sorted by lane then x isn't needed, draw all
  for(let i=0;i<packets.length;i++) drawPacket(packets[i]);

  // subtle vertical scan highlight sweeping slowly across (very faint)
  const sweepX = ((now*0.04)%(W+200))-100;
  const gradS=ctx.createLinearGradient(sweepX-80,0,sweepX+80,0);
  gradS.addColorStop(0,'hsla(142 76% 50% / 0)');
  gradS.addColorStop(0.5,'hsla(142 76% 50% / 0.04)');
  gradS.addColorStop(1,'hsla(142 76% 50% / 0)');
  ctx.fillStyle=gradS;
  ctx.fillRect(sweepX-80,0,160,H);

  rafId=requestAnimationFrame(frame);
}
if(prefersReducedMotion){
  drawStaticFrame();
} else {
  rafId=requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{
  if(document.hidden){ paused=true; if(rafId!=null) cancelAnimationFrame(rafId); }
  else { if(paused){ paused=false; lastT=performance.now(); rafId=requestAnimationFrame(frame); } }
});
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',e=>{
  prefersReducedMotion=e.matches;
  if(e.matches){ if(rafId!=null) cancelAnimationFrame(rafId); drawStaticFrame(); }
  else { lastT=performance.now(); rafId=requestAnimationFrame(frame); }
});
</script>
</body>
</html>
