<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Particle Field — AI GREEN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%}
.badge{position:fixed;top:14px;left:14px;z-index:2;display:flex;flex-direction:column;gap:2px;padding:9px 12px;background:hsla(0 0% 0% / 0.6);backdrop-filter:blur(8px);border:1px solid hsla(142 76% 50% / 0.25);font-family:ui-monospace,monospace;max-width:min(88vw,380px)}
.badge b{font-size:11px;letter-spacing:0.14em;color:hsl(142 76% 50%);font-weight:700;line-height:1}
.badge span{font-size:11px;color:#888;line-height:1.3}
.nav{position:fixed;top:14px;right:14px;z-index:2;padding:7px 12px;background:hsla(142 76% 50% / 0.12);border:1px solid hsla(142 76% 50% / 0.28);color:hsl(142 76% 50%);font-family:ui-monospace,monospace;font-size:11px;letter-spacing:0.08em;text-decoration:none}
.nav:hover{background:hsla(142 76% 50% / 0.22)}
.foot{position:fixed;bottom:10px;right:14px;z-index:2;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:0.12em;color:hsla(142 76% 50% / 0.55)}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 120% at 50% 50%, transparent 55%, #000 88%)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vignette"></div>
<div class="badge"><b>Particle Field</b><span>Drifting orbs with proximity links</span></div>
<a class="nav" href="./index.html">← Gallery</a>
<div class="foot">03 / 11 · particle-field · hsl(142 76% 50%) on #000</div>
<script>
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();

// pointer
let mx=-9999,my=-9999,hasPointer=false;
function setPointer(x,y){mx=x;my=y;hasPointer=true}
addEventListener('mousemove',e=>setPointer(e.clientX,e.clientY));
addEventListener('touchmove',e=>{
  if(e.touches[0]) setPointer(e.touches[0].clientX,e.touches[0].clientY);
},{passive:true});
addEventListener('touchstart',e=>{
  if(e.touches[0]) setPointer(e.touches[0].clientX,e.touches[0].clientY);
},{passive:true});
addEventListener('mouseleave',()=>{hasPointer=false;mx=-9999;my=-9999});
addEventListener('touchend',()=>{hasPointer=false;mx=-9999;my=-9999});

const COUNT=60;
const LINK_DIST=140;
const LINK_DIST2=LINK_DIST*LINK_DIST;
const ATTRACT_R=180;
const ATTRACT_R2=ATTRACT_R*ATTRACT_R;
const ATTRACT_FORCE=0.08;

let particles=[];
function init(){
  particles=[];
  for(let i=0;i<COUNT;i++){
    const a=Math.random()*Math.PI*2;
    const s=0.25+Math.random()*0.55;
    particles.push({
      x: Math.random()*W,
      y: Math.random()*H,
      vx: Math.cos(a)*s,
      vy: Math.sin(a)*s,
      r: 1.4+Math.random()*2.2,
      phase: Math.random()*Math.PI*2,
      wander: Math.random()*Math.PI*2
    });
  }
}
init();
// keep particles in range on resize without full re-init
addEventListener('resize',()=>{
  for(const p of particles){
    if(p.x>W) p.x=Math.random()*W;
    if(p.y>H) p.y=Math.random()*H;
  }
});

let t=0;
function frame(){
  t+=0.016;

  // fade instead of clear for subtle motion trail — but keep it near-clear
  ctx.clearRect(0,0,W,H);

  // update positions
  for(let i=0;i<particles.length;i++){
    const p=particles[i];
    // Perlin-like wander: slowly rotating drift vector
    p.wander += (Math.random()-0.5)*0.12;
    const wA = p.wander;
    const wS = 0.04;
    p.vx += Math.cos(wA)*wS*0.18;
    p.vy += Math.sin(wA)*wS*0.18;

    // gentle damping so wander doesn't explode
    p.vx *= 0.994;
    p.vy *= 0.994;

    // pointer attract
    if(hasPointer){
      const dx=mx-p.x, dy=my-p.y;
      const d2=dx*dx+dy*dy;
      if(d2<ATTRACT_R2 && d2>0.01){
        const d=Math.sqrt(d2);
        const f=(1-d/ATTRACT_R)*ATTRACT_FORCE;
        // normalize then apply
        p.vx += (dx/d)*f;
        p.vy += (dy/d)*f;
      }
    }

    // clamp speed
    const sp=Math.hypot(p.vx,p.vy);
    const maxSp=1.15;
    if(sp>maxSp){ p.vx=p.vx/sp*maxSp; p.vy=p.vy/sp*maxSp; }

    p.x += p.vx;
    p.y += p.vy;

    // wrap with soft margin so links don't pop at edge
    const m=12;
    if(p.x<-m) p.x=W+m;
    else if(p.x>W+m) p.x=-m;
    if(p.y<-m) p.y=H+m;
    else if(p.y>H+m) p.y=-m;

    p.phase += 0.025 + p.r*0.004;
  }

  // connections — O(n^2) but n=60 => 1770 checks, trivial
  ctx.lineCap='round';
  for(let i=0;i<particles.length;i++){
    for(let j=i+1;j<particles.length;j++){
      const a=particles[i], b=particles[j];
      const dx=a.x-b.x, dy=a.y-b.y;
      const d2=dx*dx+dy*dy;
      if(d2<LINK_DIST2){
        const d=Math.sqrt(d2);
        const alpha=(1-d/LINK_DIST)*0.33;
        ctx.beginPath();
        ctx.moveTo(a.x,a.y);
        ctx.lineTo(b.x,b.y);
        ctx.strokeStyle='hsla(142 76% 50% / '+alpha.toFixed(3)+')';
        ctx.lineWidth=0.7;
        ctx.stroke();
      }
    }
  }

  // particles — halo then core
  for(const p of particles){
    const pulse=0.85+Math.sin(p.phase)*0.15;

    // outer soft halo
    ctx.beginPath();
    ctx.arc(p.x,p.y, p.r*4.2, 0, Math.PI*2);
    ctx.fillStyle='hsla(142 76% 50% / 0.06)';
    ctx.fill();

    // mid halo
    ctx.beginPath();
    ctx.arc(p.x,p.y, p.r*2.4, 0, Math.PI*2);
    ctx.fillStyle='hsla(142 76% 50% / 0.14)';
    ctx.fill();

    // core
    ctx.beginPath();
    ctx.arc(p.x,p.y, p.r*pulse, 0, Math.PI*2);
    ctx.fillStyle='hsl(142 76% 50%)';
    ctx.shadowColor='hsl(142 76% 50%)';
    ctx.shadowBlur=7;
    ctx.fill();
    ctx.shadowBlur=0;

    // inner highlight
    ctx.beginPath();
    ctx.arc(p.x,p.y, p.r*0.45, 0, Math.PI*2);
    ctx.fillStyle='hsla(142 76% 50% / 0.9)';
    ctx.fill();
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
