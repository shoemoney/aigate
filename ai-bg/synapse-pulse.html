<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Synapse Pulse — AI GREEN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000000}
canvas{display:block;width:100%;height:100%}
.badge{position:fixed;top:14px;left:14px;z-index:2;display:flex;flex-direction:column;gap:2px;padding:9px 13px;background:hsla(142 76% 50% / 0.06);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid hsla(142 76% 50% / 0.25);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.badge b{font-size:11px;letter-spacing:0.14em;color:hsl(142 76% 50%);font-weight:700;line-height:1}
.badge span{font-size:10px;letter-spacing:0.04em;color:hsla(142 76% 50% / 0.65);line-height:1.4}
.nav{position:fixed;top:14px;right:14px;z-index:2;padding:7px 12px;background:hsla(142 76% 50% / 0.12);border:1px solid hsla(142 76% 50% / 0.28);color:hsl(142 76% 50%);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:0.08em;text-decoration:none;transition:background .18s}
.nav:hover{background:hsla(142 76% 50% / 0.22)}
.foot{position:fixed;bottom:10px;right:14px;z-index:2;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;letter-spacing:0.12em;color:hsla(142 76% 50% / 0.55)}
.foot-nav{display:inline-flex;gap:8px;align-items:center}
.foot-nav a{color:hsl(142 76% 50%);text-decoration:none;border:1px solid hsla(142 76% 50% / 0.18);padding:2px 8px;border-radius:999px;font-size:10px;letter-spacing:0.08em}
.foot-nav a:hover{border-color:hsla(142 76% 50% / 0.4);background:hsla(142 76% 50% / 0.08)}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(125% 125% at 50% 50%, transparent 52%, rgba(0,0,0,0.45) 78%, #000000 92%)}
@media(prefers-reduced-motion:reduce){canvas{opacity:0.85}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vignette"></div>
<div class="badge"><b>SYNAPSE PULSE</b><span>Radial pulses from firing neurons</span></div>
<a class="nav" href="./index.html">← Gallery</a>
<div class="foot"><span>08 / 11 · synapse-pulse · hsl(142 76% 50%) on #000</span><span class="foot-nav"><a href="./hex-mesh.html">← Prev</a> · <a href="./binary-rain.html">Next →</a></span></div>
<script>
let prefersReducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let rafId = null;
let paused = document.hidden;
document.addEventListener('visibilitychange', () => {
  if (document.hidden) { paused = true; if (rafId != null) cancelAnimationFrame(rafId); }
  else { if (paused) { paused = false; if (!prefersReducedMotion) rafId = requestAnimationFrame(frame); } }
});
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change', e => {
  prefersReducedMotion = e.matches;
  if (e.matches) { if (rafId != null) cancelAnimationFrame(rafId); }
  else if (!paused) { rafId = requestAnimationFrame(frame); }
});
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, DPR;
function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth; H = innerHeight;
  canvas.width = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  layout();
}
const GREEN = 'hsl(142 76% 50%)';
const GA = a => `hsla(142 76% 50% / ${a})`;

// --- centers + dendrites ---
let centers = [];
let dendrites = [];
let pulses = [];

function mulberry32(a){
  return function(){
    let t = a += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

function layout(){
  centers = [
    { x: W*0.50, y: H*0.50 },
    { x: W*0.23, y: H*0.30 },
    { x: W*0.77, y: H*0.28 },
    { x: W*0.26, y: H*0.74 },
    { x: W*0.75, y: H*0.72 },
  ].map((c,i)=>({
    x:c.x, y:c.y, id:i,
    // random phase 0–2000ms offset so pulses don't sync
    nextEmit: performance.now() + Math.random()*1600 + i*95,
    speed: 92 + Math.random()*42, // 92–134 px/s
    maxR: Math.hypot(Math.max(c.x, W-c.x), Math.max(c.y, H-c.y))*0.94,
    flash: 0
  }));
  buildDendrites();
}

function buildDendrites(){
  dendrites = [];
  const rnd = mulberry32(42);
  function branch(x0,y0,ang,len,depth,w){
    if(depth<=0 || len<7) return;
    const x1 = x0 + Math.cos(ang)*len;
    const y1 = y0 + Math.sin(ang)*len;
    dendrites.push({x0,y0,x1,y1,w, alpha: 0.055 + depth*0.018});
    if(depth===1) return;
    const forks = depth>3 ? 2 : (rnd()>0.38 ? 2 : 1);
    for(let f=0; f<forks; f++){
      const spread = 0.55 + rnd()*0.52;
      const dir = f===0 ? -1 : 1;
      const na = ang + dir*spread*(0.72+rnd()*0.55) + (rnd()-0.5)*0.16;
      const nl = len*(0.57 + rnd()*0.23);
      const nw = Math.max(0.5, w*0.71);
      branch(x1,y1,na,nl,depth-1,nw);
    }
    if(depth>2 && rnd()>0.60){
      branch(x1,y1, ang+(rnd()-0.5)*0.38, len*(0.60+rnd()*0.18), depth-1, w*0.84);
    }
  }
  centers.forEach(c=>{
    const arms = 4 + Math.floor(rnd()*2);
    const base = rnd()*Math.PI*2;
    for(let a=0;a<arms;a++){
      const ang = base + (a/arms)*Math.PI*2 + (rnd()-0.5)*0.42;
      const len = 54 + rnd()*62 + Math.min(W,H)*0.028;
      branch(c.x,c.y,ang,len,4,1.15);
      if(rnd()>0.52) branch(c.x,c.y, ang+(rnd()-0.5)*0.9, len*0.52, 3, 0.7);
    }
  });
}

// --- emission ---
function maybeEmit(now){
  for(const c of centers){
    if(now >= c.nextEmit){
      pulses.push({ cx:c.x, cy:c.y, cid:c.id, birth:now, speed: c.speed*(0.92+Math.random()*0.16), maxR:c.maxR, _r:0, _a:0 });
      c.nextEmit = now + 1200 + Math.random()*800; // 1.2–2.0s
      c.flash = 1; // center burst
    }
  }
}

// --- draw helpers ---
function drawDendrites(){
  ctx.save();
  ctx.lineCap='round';
  for(const s of dendrites){
    ctx.beginPath(); ctx.moveTo(s.x0,s.y0); ctx.lineTo(s.x1,s.y1);
    // use 0.5 alpha variant requirement — dendrites sit in that 0.5 family at low opacity
    ctx.strokeStyle = GA(s.alpha);
    ctx.lineWidth = s.w;
    ctx.stroke();
  }
  ctx.restore();
}

function drawPulses(now){
  const alive=[];
  ctx.save();
  ctx.lineCap='round';
  for(let i=0;i<pulses.length;i++){
    const p=pulses[i];
    const age=(now-p.birth)/1000;
    const r=age*p.speed;
    if(r > p.maxR+4) continue;
    const t=r/p.maxR;
    const alpha=(1 - t)*(1 - t)*0.92;
    if(alpha < 0.011) continue;
    p._r=r; p._a=alpha;
    alive.push(p);
    // 2px stroke fading to transparent — core ring
    ctx.beginPath(); ctx.arc(p.cx,p.cy,r,0,Math.PI*2);
    ctx.strokeStyle = GA(alpha);
    ctx.lineWidth = 2;
    // soft glow only while young to stay 60fps — uses same green
    if(t < 0.58){
      ctx.shadowColor = GREEN;
      ctx.shadowBlur = 10*(1 - t);
    } else ctx.shadowBlur = 0;
    ctx.stroke();
    ctx.shadowBlur = 0;
  }
  ctx.restore();
  pulses=alive;
  return alive;
}

function drawIntersections(active){
  if(active.length<2) return;
  ctx.save();
  ctx.globalCompositeOperation='lighter';
  for(let i=0;i<active.length;i++){
    const a=active[i];
    for(let j=i+1;j<active.length;j++){
      const b=active[j];
      if(a.cid===b.cid) continue;
      const dx=b.cx-a.cx, dy=b.cy-a.cy;
      const d=Math.hypot(dx,dy);
      const r1=a._r, r2=b._r;
      if(d===0 || d > r1+r2 || d < Math.abs(r1-r2)) continue;
      if(a._a < 0.05 || b._a < 0.05) continue;
      const aTerm=(r1*r1 - r2*r2 + d*d)/(2*d);
      const h2=r1*r1 - aTerm*aTerm;
      if(h2 <= 0) continue;
      const h=Math.sqrt(h2);
      const xm=a.cx + aTerm*dx/d;
      const ym=a.cy + aTerm*dy/d;
      const rx=-dy*(h/d), ry=dx*(h/d);
      const pts=[{x:xm+rx,y:ym+ry},{x:xm-rx,y:ym-ry}];
      const intensity=Math.min(1, Math.sqrt(a._a*b._a)*2.15 + 0.32);
      const haloA=intensity*0.52;
      for(const pt of pts){
        if(pt.x < -16 || pt.x > W+16 || pt.y < -16 || pt.y > H+16) continue;
        // halo — 0.5 alpha family when dim
        const g=ctx.createRadialGradient(pt.x,pt.y,0,pt.x,pt.y,16);
        g.addColorStop(0, GA(haloA));
        g.addColorStop(0.38, GA(haloA*0.42));
        g.addColorStop(1, GA(0));
        ctx.fillStyle=g;
        ctx.beginPath(); ctx.arc(pt.x,pt.y,16,0,Math.PI*2); ctx.fill();
        // bright core
        ctx.shadowColor=GREEN; ctx.shadowBlur=13;
        ctx.fillStyle=GA(Math.min(1,intensity));
        ctx.beginPath(); ctx.arc(pt.x,pt.y,3.1,0,Math.PI*2); ctx.fill();
        ctx.shadowBlur=0;
        ctx.fillStyle=GA(1);
        ctx.beginPath(); ctx.arc(pt.x,pt.y,1.25,0,Math.PI*2); ctx.fill();
        // cross sparkle
        ctx.strokeStyle=GA(intensity*0.88);
        ctx.lineWidth=1;
        ctx.beginPath();
        ctx.moveTo(pt.x-4.5,pt.y); ctx.lineTo(pt.x+4.5,pt.y);
        ctx.moveTo(pt.x,pt.y-4.5); ctx.lineTo(pt.x,pt.y+4.5);
        ctx.stroke();
      }
    }
  }
  ctx.restore();
}

function drawCenters(now){
  for(let i=0;i<centers.length;i++){
    const c=centers[i];
    if(c.flash>0) c.flash=Math.max(0,c.flash-0.085);
    const breathe=0.88+Math.sin(now*0.0011+i*1.9)*0.10;
    const rCore=4.4*breathe;
    const rGlow=19*breathe;
    const f=c.flash;
    // outer glow
    const g=ctx.createRadialGradient(c.x,c.y,0,c.x,c.y,rGlow);
    g.addColorStop(0, GA(0.38+f*0.28));
    g.addColorStop(0.40, GA(0.14+f*0.10));
    g.addColorStop(1, GA(0));
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.arc(c.x,c.y,rGlow,0,Math.PI*2); ctx.fill();
    // core
    ctx.beginPath(); ctx.arc(c.x,c.y,rCore,0,Math.PI*2);
    ctx.fillStyle=GA(0.97+f*0.03);
    ctx.shadowColor=GREEN; ctx.shadowBlur=11+f*10; ctx.fill(); ctx.shadowBlur=0;
    ctx.beginPath(); ctx.arc(c.x,c.y, Math.max(1.2,rCore*0.42),0,Math.PI*2);
    ctx.fillStyle=GA(1); ctx.fill();
  }
}

// --- rAF ---
resize();
addEventListener('resize', resize, {passive:true});

// seed one pulse per center so screen isn't empty
const t0=performance.now();
centers.forEach((c,i)=>{
  const lag=i===0?70:240+Math.random()*900+i*110;
  pulses.push({cx:c.x,cy:c.y,cid:c.id,birth:t0-lag,speed:c.speed,maxR:c.maxR,_r:0,_a:0});
});
function frame(now){
  if (paused) return;
  ctx.fillStyle='#000000';
  ctx.fillRect(0,0,W,H);
  maybeEmit(now);
  drawDendrites();
  const active=drawPulses(now);
  drawIntersections(active);
  drawCenters(now);
  if (!prefersReducedMotion) rafId = requestAnimationFrame(frame);
}
if (prefersReducedMotion) { frame(performance.now()); } else { rafId = requestAnimationFrame(frame); }
</script>
</body>
</html>
