<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Neural Network — AI GREEN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000000}
canvas{display:block;width:100%;height:100%}
.badge{position:fixed;top:14px;left:14px;z-index:2;display:flex;flex-direction:column;gap:2px;padding:9px 13px;background:hsla(142 76% 8% / 0.72);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid hsla(142 76% 50% / 0.25);font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.badge b{font-size:11px;letter-spacing:0.14em;color:hsl(142 76% 50%);font-weight:700;line-height:1}
.badge span{font-size:10px;letter-spacing:0.04em;color:hsla(142 76% 50% / 0.65);line-height:1.4}
.nav{position:fixed;top:14px;right:14px;z-index:2;padding:7px 12px;background:hsla(142 76% 50% / 0.12);border:1px solid hsla(142 76% 50% / 0.28);color:hsl(142 76% 50%);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:11px;letter-spacing:0.08em;text-decoration:none;transition:background .18s}
.nav:hover{background:hsla(142 76% 50% / 0.22)}
.foot{position:fixed;bottom:10px;right:14px;z-index:2;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:10px;letter-spacing:0.12em;color:hsla(142 76% 50% / 0.55)}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(125% 125% at 50% 50%, transparent 52%, hsla(142 76% 4% / 0.45) 78%, #000000 92%)}
@media(prefers-reduced-motion:reduce){canvas{opacity:0.85}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vignette"></div>
<div class="badge"><b>NEURAL NETWORK</b><span>Nodes &amp; synapses firing across a black void</span></div>
<a class="nav" href="./index.html">← Gallery</a>
<div class="foot">01 / 11 · neural-network · hsl(142 76% 50%) on #000</div>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H, DPR;

// --- sizing ---
function resize() {
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = innerWidth;
  H = innerHeight;
  canvas.width  = Math.round(W * DPR);
  canvas.height = Math.round(H * DPR);
  canvas.style.width  = W + 'px';
  canvas.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
resize();

// --- nodes ---
const N = 28;
let nodes = [];
let edges = [];

function makeNodes() {
  nodes = [];
  for (let i = 0; i < N; i++) {
    nodes.push({
      x: Math.random() * W * 0.82 + W * 0.09,
      y: Math.random() * H * 0.78 + H * 0.11,
      r: 4 + Math.random() * 3.5,
      pulse: Math.random() * Math.PI * 2,
      fire: 0,
      vx: (Math.random() - 0.5) * 0.28,
      vy: (Math.random() - 0.5) * 0.28
    });
  }
}

function buildEdges() {
  edges = [];
  const seen = new Set();
  for (let i = 0; i < N; i++) {
    const dists = [];
    for (let j = 0; j < N; j++) if (i !== j) {
      const dx = nodes[i].x - nodes[j].x;
      const dy = nodes[i].y - nodes[j].y;
      dists.push({ j, d: dx*dx + dy*dy });
    }
    dists.sort((a,b) => a.d - b.d);
    const k = 2 + Math.floor(Math.random() * 2); // 2–3 nearest
    for (let t = 0; t < k; t++) {
      if (!dists[t]) continue;
      const a = Math.min(i, dists[t].j);
      const b = Math.max(i, dists[t].j);
      const key = a + ':' + b;
      if (!seen.has(key)) { seen.add(key); edges.push({ a, b, packets: [] }); }
    }
  }
  // seed initial packets on ~70% of edges
  for (const e of edges) {
    if (Math.random() < 0.70) e.packets.push({ t: Math.random(), speed: 0.003 + Math.random() * 0.005 });
  }
}

function initGraph() { makeNodes(); buildEdges(); }
initGraph();

// anchor nodes proportionally on resize instead of full respawn when size change is small;
// full rebuild only when aspect wildly changed — keeps the void alive while fitting new viewport
let lastW = W, lastH = H;
addEventListener('resize', () => {
  const prevW = lastW, prevH = lastH;
  resize();
  const sx = W / prevW, sy = H / prevH;
  // if scale is moderate, just reproject; if extreme (orientation flip), rebuild
  if (sx > 0.55 && sx < 1.85 && sy > 0.55 && sy < 1.85) {
    for (const n of nodes) { n.x *= sx; n.y *= sy; }
  } else {
    initGraph();
  }
  lastW = W; lastH = H;
});

// --- firing / propagation ---
function fireRandomNode() {
  const idx = Math.floor(Math.random() * N);
  nodes[idx].fire = 1;
  // push a packet outward along each incident edge
  for (const e of edges) {
    if (e.a === idx || e.b === idx) {
      if (e.packets.length < 2 && Math.random() < 0.65) {
        // direction: away from the firing node
        const awayFromA = (e.a === idx) ? 1 : -1; // t 0→1 is a→b, so a firing means t increases
        // normalize: we always store t as 0→1 regardless of dir; dir concept replaced by which end we start at
        // to go b→a we start at 1 and decrease — simpler: push at correct end
        if (awayFromA === 1) e.packets.push({ t: 0, speed: 0.007 + Math.random() * 0.006, dir: 1 });
        else e.packets.push({ t: 1, speed: 0.007 + Math.random() * 0.006, dir: -1 });
      }
    }
  }
}
function spawnAmbientPacket() {
  const e = edges[Math.floor(Math.random() * edges.length)];
  if (!e || e.packets.length >= 2) return;
  // ambient packets always travel a→b
  e.packets.push({ t: 0, speed: 0.004 + Math.random() * 0.005, dir: 1 });
}

const fireTimer = setInterval(fireRandomNode, 640);
const ambientTimer = setInterval(spawnAmbientPacket, 380);

// --- frame ---
let t = 0;
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

function frame() {
  t += 0.016;

  // fade instead of hard clear — subtle motion trails without smearing the black
  ctx.clearRect(0, 0, W, H);

  // drift
  for (const n of nodes) {
    if (!reduceMotion) {
      n.x += n.vx;
      n.y += n.vy;
      if (n.x < 28 || n.x > W - 28) n.vx *= -1;
      if (n.y < 28 || n.y > H - 28) n.vy *= -1;
      n.pulse += 0.038 + Math.random() * 0.008;
    } else {
      n.pulse += 0.015;
    }
    if (n.fire > 0) n.fire = Math.max(0, n.fire - 0.068);
  }

  // --- edges (bezier) ---
  ctx.lineCap = 'round';
  for (const e of edges) {
    const a = nodes[e.a], b = nodes[e.b];
    const mx = (a.x + b.x) * 0.5, my = (a.y + b.y) * 0.5;
    const ox = (b.y - a.y) * 0.08, oy = (a.x - b.x) * 0.08;
    const cx = mx + ox, cy = my + oy;

    // outer soft glow (wide, faint)
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.quadraticCurveTo(cx, cy, b.x, b.y);
    ctx.strokeStyle = 'hsla(142 76% 50% / 0.09)';
    ctx.lineWidth = 3.6;
    ctx.stroke();

    // sharp core line
    ctx.beginPath();
    ctx.moveTo(a.x, a.y);
    ctx.quadraticCurveTo(cx, cy, b.x, b.y);
    ctx.strokeStyle = 'hsla(142 76% 50% / 0.22)';
    ctx.lineWidth = 1.05;
    ctx.stroke();

    // packets — iterate backwards so splice is safe
    for (let i = e.packets.length - 1; i >= 0; i--) {
      const p = e.packets[i];
      // advance along curve
      p.t += p.speed * p.dir;
      // remove when it reaches the far end
      if ((p.dir === 1 && p.t >= 1) || (p.dir === -1 && p.t <= 0)) { e.packets.splice(i, 1); continue; }
      const tt = p.t; // already 0..1
      // quadratic bezier interpolation
      const mt = 1 - tt;
      const x = mt*mt*a.x + 2*mt*tt*cx + tt*tt*b.x;
      const y = mt*mt*a.y + 2*mt*tt*cy + tt*tt*b.y;

      // packet glow + core
      ctx.beginPath();
      ctx.arc(x, y, 5, 0, Math.PI * 2);
      ctx.fillStyle = 'hsla(142 76% 50% / 0.13)';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(x, y, 2.1, 0, Math.PI * 2);
      ctx.fillStyle = 'hsl(142 76% 50%)';
      ctx.shadowColor = 'hsl(142 76% 50%)';
      ctx.shadowBlur = 9;
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  // --- nodes ---
  for (const n of nodes) {
    const pulseScale = 1 + Math.sin(n.pulse) * 0.12;
    const f = n.fire; // 0..1 flash

    // outer halo — breathes + flares on fire
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r * 2.9 * pulseScale, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(142 76% 50% / ${0.06 + f * 0.20})`;
    ctx.fill();

    // mid halo
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r * 1.65, 0, Math.PI * 2);
    ctx.fillStyle = `hsla(142 76% 50% / ${0.11 + f * 0.28})`;
    ctx.fill();

    // ring — brightens on fire
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.r * pulseScale, 0, Math.PI * 2);
    ctx.strokeStyle = `hsla(142 76% 50% / ${0.55 + f * 0.45})`;
    ctx.lineWidth = 1.4;
    // firing flash: extra glow
    if (f > 0.12) { ctx.shadowColor = 'hsl(142 76% 50%)'; ctx.shadowBlur = 10 + f * 12; }
    ctx.stroke();
    ctx.shadowBlur = 0;

    // hot core when firing
    if (f > 0.05) {
      ctx.beginPath();
      ctx.arc(n.x, n.y, n.r * 0.55, 0, Math.PI * 2);
      ctx.fillStyle = `hsla(142 76% 50% / ${f * 0.92})`;
      ctx.fill();
    }
  }

  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// cleanup on page hide
addEventListener('visibilitychange', () => {
  if (document.hidden) { /* rAF throttles automatically, timers keep cadence */ }
});
</script>
</body>
</html>
