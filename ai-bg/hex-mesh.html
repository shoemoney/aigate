<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Hex Mesh — AI GREEN</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000}
canvas{display:block;width:100%;height:100%}
.badge{position:fixed;top:14px;left:14px;z-index:2;display:flex;align-items:center;gap:10px;padding:8px 12px;background:hsla(0 0% 0% / 0.6);backdrop-filter:blur(8px);border:1px solid hsla(142 76% 50% / 0.25);font-family:ui-monospace,monospace}
.badge b{font-size:11px;letter-spacing:0.14em;color:hsl(142 76% 50%);font-weight:700}
.badge span{font-size:11px;color:hsla(142 76% 50% / 0.65)}
.nav{position:fixed;top:14px;right:14px;z-index:2;padding:7px 12px;background:hsla(142 76% 50% / 0.12);border:1px solid hsla(142 76% 50% / 0.28);color:hsl(142 76% 50%);font-family:ui-monospace,monospace;font-size:11px;letter-spacing:0.08em;text-decoration:none}
.foot{position:fixed;bottom:10px;right:14px;z-index:2;display:flex;align-items:center;gap:12px;flex-wrap:wrap;font-family:ui-monospace,monospace;font-size:10px;letter-spacing:0.12em;color:hsla(142 76% 50% / 0.55)}
.foot-nav{display:inline-flex;gap:8px;align-items:center}
.foot-nav a{color:hsl(142 76% 50%);text-decoration:none;border:1px solid hsla(142 76% 50% / 0.18);padding:2px 8px;border-radius:999px;font-size:10px;letter-spacing:0.08em}
.foot-nav a:hover{border-color:hsla(142 76% 50% / 0.4);background:hsla(142 76% 50% / 0.08)}
.vignette{position:fixed;inset:0;pointer-events:none;background:radial-gradient(120% 120% at 50% 50%, transparent 55%, #000 88%)}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="vignette"></div>
<div class="badge"><b>HEX MESH</b><span>honeycomb · breathing waves propagate</span></div>
<a class="nav" href="./index.html">← Gallery</a>
<div class="foot"><span>07 / 11 · hex-mesh · hsl(142 76% 50%) on #000</span><span class="foot-nav"><a href="./data-stream.html">← Prev</a> · <a href="./synapse-pulse.html">Next →</a></span></div>
<script>
let prefersReducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
let rafId=null, paused=document.hidden;
document.addEventListener('visibilitychange',()=>{ if(document.hidden){ paused=true; if(rafId!=null) cancelAnimationFrame(rafId); } else { if(paused){ paused=false; rafId=requestAnimationFrame(frame); } } });
matchMedia('(prefers-reduced-motion: reduce)').addEventListener('change',e=>{ prefersReducedMotion=e.matches; if(e.matches){ if(rafId!=null) cancelAnimationFrame(rafId); } else { rafId=requestAnimationFrame(frame); } });
const canvas=document.getElementById('c'),ctx=canvas.getContext('2d');
let W,H,DPR;
function resize(){DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;canvas.width=W*DPR;canvas.height=H*DPR;canvas.style.width=W+'px';canvas.style.height=H+'px';ctx.setTransform(DPR,0,0,DPR,0,0)}
addEventListener('resize',resize);resize();

let hexes=[];
let waves=[];
function build(){
  hexes=[];
  let r=28;
  let dx=r*1.5, dy=r*Math.sqrt(3);
  let cols=Math.ceil(W/dx)+2, rows=Math.ceil(H/dy)+2;
  for(let row=-1;row<rows;row++){
    for(let col=-1;col<cols;col++){
      let x=col*dx + (row%2? dx/2:0);
      let y=row*dy*0.5 + r;
      hexes.push({x,y,r,fill:0,glow:0,base: Math.random()*Math.PI*2});
    }
  }
}
build();
addEventListener('resize',build);

// spawn waves
setInterval(()=>{
  let h=hexes[Math.floor(Math.random()*hexes.length)];
  waves.push({x:h.x,y:h.y,r:0,speed: 78+Math.random()*42, alpha:0.7});
}, 850);

function hexPath(x,y,r){
  ctx.beginPath();
  for(let i=0;i<6;i++){
    let a=Math.PI/2 + i*Math.PI/3;
    let px=x+Math.cos(a)*r, py=y+Math.sin(a)*r;
    if(i===0) ctx.moveTo(px,py); else ctx.lineTo(px,py);
  }
  ctx.closePath();
}

function frame(t){
  if(paused) return;
  let time=t*0.001;
  ctx.clearRect(0,0,W,H);
  // drift
  let driftX=Math.sin(time*0.18)*10, driftY=Math.cos(time*0.22)*6;
  // update waves
  waves.forEach(w=>{ w.r+=w.speed*0.016; w.alpha*=0.995; });
  waves=waves.filter(w=>w.alpha>0.015 && w.r<Math.max(W,H)*0.9);
  // for each hex compute wave influence
  hexes.forEach(h=>{
    let infl=0;
    waves.forEach(w=>{
      let d=Math.hypot(h.x-w.x,h.y-w.y);
      let diff=Math.abs(d-w.r);
      if(diff<36) infl+= (1-diff/36)*w.alpha*0.95;
    });
    // base breathe
    let breathe=0.04*Math.sin(time*0.7+h.base);
    h._infl=Math.min(1, infl+breathe*0.5+0.08);
    h._wAlpha=infl;
  });

  ctx.save(); ctx.translate(driftX,driftY);
  hexes.forEach(h=>{
    let r=h.r*0.88;
    hexPath(h.x,h.y,r);
    let aStroke=0.14 + h._infl*0.42;
    ctx.strokeStyle=`hsla(142 76% 50% / ${aStroke})`;
    ctx.lineWidth= h._wAlpha>0.15?1.3:0.85;
    ctx.stroke();
    if(h._infl>0.18){
      hexPath(h.x,h.y,r*0.92);
      ctx.fillStyle=`hsla(142 76% 50% / ${h._infl*0.16})`;
      ctx.fill();
      if(h._wAlpha>0.25){
        hexPath(h.x,h.y,r*0.45);
        ctx.fillStyle=`hsla(142 76% 50% / ${h._wAlpha*0.55})`;
        ctx.shadowColor='hsl(142 76% 50%)'; ctx.shadowBlur=9; ctx.fill(); ctx.shadowBlur=0;
      }
    }
  });
  ctx.restore();
  if(!prefersReducedMotion) rafId=requestAnimationFrame(frame);
}
if(prefersReducedMotion) frame(0); else rafId=requestAnimationFrame(frame);
</script>
</body>
</html>
