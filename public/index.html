<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aigate</title>
<style>
/* ============ control-room tokens (approved mockup variant-a) ============ */
:root{
  --bg:#101211; --panel:#171916; --inset:#0c0e0c; --line:#262a24;
  --fg:#e8e6df; --dim:#8f9089; --accent:#e8b34b;
  --ok:#5fae7a; --warn:#d99a3d; --crit:#e05d44;
  --mono:ui-monospace,"SF Mono",SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{color-scheme:dark}
body{background:var(--bg);color:var(--fg);font:16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.dim{color:var(--dim)} .ok{color:var(--ok)} .warn{color:var(--warn)} .crit{color:var(--crit)} .acc{color:var(--accent)}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
button:focus-visible,input:focus-visible{outline:1px solid var(--accent);outline-offset:2px}
::selection{background:rgba(232,179,75,.25)}
.vhidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
[hidden]{display:none!important}

/* ---------- login overlay ---------- */
#login{position:fixed;inset:0;z-index:50;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.login-card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:36px 34px 30px;width:min(420px,94vw);display:flex;flex-direction:column;gap:11px}
.login-card .logo{font-weight:700;font-size:17px;letter-spacing:.18em;margin-bottom:6px}
.login-card .logo span{margin-right:9px}
.login-card label{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.login-card .hint{font-size:13px;color:var(--dim)}
.login-card .hint code{font-family:var(--mono);font-size:12.5px;color:var(--accent)}
.login-card input{background:var(--inset);border:1px solid var(--line);border-radius:4px;color:var(--fg);font-family:var(--mono);font-size:14px;padding:11px 12px;width:100%}
.login-card input::placeholder{color:var(--dim)}
#loginmsg{font-family:var(--mono);font-size:12.5px;color:var(--crit);min-height:18px;margin-top:2px}

/* ---------- header ---------- */
header{position:sticky;top:0;z-index:20;background:rgba(16,18,17,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.hwrap{max-width:1240px;margin:0 auto;padding:0 24px;min-height:62px;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{font-weight:700;font-size:15px;letter-spacing:.18em;white-space:nowrap}
.logo span{margin-right:8px}
.live{display:flex;align-items:center;gap:7px;font-family:var(--mono);font-size:13px;color:var(--ok)}
.live i{width:8px;height:8px;border-radius:50%;background:var(--ok);animation:pulse 2.2s ease-in-out infinite}
.live.off{color:var(--crit)}
.live.off i{background:var(--crit);animation:none}
.rollup{font-family:var(--mono);font-size:13px;color:var(--dim);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.clock{font-size:14px;color:var(--fg)}
.btn{padding:6px 13px;border:1px solid var(--line);border-radius:4px;font-size:14px;color:var(--dim);transition:.15s}
.btn:hover{color:var(--fg);border-color:var(--dim);background:var(--panel)}
.btn.accent{border-color:rgba(232,179,75,.5);color:var(--accent)}
.btn.accent:hover{background:rgba(232,179,75,.08);border-color:var(--accent)}
.btn.sm{padding:4px 10px;font-size:12.5px;font-family:var(--mono)}
.btn[aria-pressed="true"]{border-color:rgba(232,179,75,.55);color:var(--accent);background:rgba(232,179,75,.06)}

/* ---------- critical banner ---------- */
.banner{background:var(--crit);color:#17110e;font-weight:600;font-size:15px}
.banner div{max-width:1240px;margin:0 auto;padding:11px 24px;display:flex;gap:10px;align-items:baseline}
.banner b{font-family:var(--mono);font-size:12.5px;letter-spacing:.14em}

/* ---------- layout / sections ---------- */
main{max-width:1240px;margin:0 auto;padding:0 24px}
section{padding:38px 0 42px;border-top:1px solid var(--line)}
section:first-child{border-top:0}
.sec-head{display:flex;align-items:baseline;gap:12px;margin-bottom:22px}
.sec-num{font-family:var(--mono);font-size:13px;color:var(--accent)}
.sec-head h2{font-size:14px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.sec-note{margin-left:auto;font-family:var(--mono);font-size:12px;color:var(--dim)}

/* ---------- inbox ---------- */
.inbox-row{display:flex;align-items:center;gap:12px;padding:13px 16px;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--crit);border-radius:4px;margin-bottom:9px;transition:.15s}
.inbox-row.warn-row{border-left-color:var(--warn)}
.inbox-row:hover{border-color:#333830}
.inbox-row p{font-size:15px;flex:1;min-width:0}
.inbox-row code{font-family:var(--mono);font-size:13.5px;background:var(--inset);border:1px solid var(--line);border-radius:3px;padding:2px 7px;color:var(--accent)}
.x{color:var(--dim);padding:5px 9px;border-radius:3px;font-family:var(--mono)}
.x:hover{color:var(--crit);background:var(--inset)}

/* ---------- account cards ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:22px 22px 17px;display:flex;flex-direction:column;gap:15px;transition:border-color .15s}
.card:hover{border-color:#333830}
.card.is-parked{opacity:.85}.card.is-disabled{opacity:.62}
.card-head{display:flex;align-items:center;gap:10px}
.acct{font-family:var(--mono);font-size:17px;font-weight:600}
.alabel{font-size:13px;color:var(--dim);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);border:1px solid rgba(232,179,75,.55);border-radius:3px;padding:3px 7px;font-family:var(--mono)}
.chip{margin-left:auto;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;padding:4px 9px;border:1px solid;border-radius:3px;background:transparent;white-space:nowrap}
.chip.c-ok{color:var(--ok);border-color:rgba(95,174,122,.55)}
.chip.c-warn{color:var(--warn);border-color:rgba(217,154,61,.55)}
.chip.c-crit{color:var(--crit);border-color:rgba(224,93,68,.6)}
.chip.c-dim{color:var(--dim);border-color:var(--line)}
.hero-row{display:flex;align-items:flex-end;justify-content:space-between;gap:14px}
.hero-num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:42px;font-weight:600;line-height:1;letter-spacing:-.01em}
.hero-num small{font-size:21px;font-weight:400;opacity:.75;margin-left:2px}
.hero-num.pulse{animation:pulse 2.6s ease-in-out infinite}
.hero-label{display:block;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);margin-top:7px}
.spark{width:128px;height:38px;background:var(--inset);border:1px solid var(--line);border-radius:3px;padding:4px;flex:none}
.spark svg{display:block;width:100%;height:100%}
.gauges{display:flex;flex-direction:column;gap:13px}
.g-top{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--dim);margin-bottom:6px}
.g-top b{font-weight:500;text-transform:none;letter-spacing:0}
.track{position:relative;height:7px;background:var(--inset);border:1px solid var(--line);border-radius:3px}
.fill{position:absolute;top:0;left:0;bottom:0;border-radius:2px;transition:width .5s cubic-bezier(.4,0,.2,1)}
.fill.ok{background:var(--ok)}.fill.warn{background:var(--warn)}.fill.crit{background:var(--crit)}.fill.neu{background:#b9b7ab}
.tick{position:absolute;top:-3px;width:1px;height:13px;background:var(--dim);opacity:.55}
.tick.t95{width:2px;background:var(--accent);opacity:1}
.ticklabels{position:relative;height:14px;margin-top:4px;font-family:var(--mono);font-size:9.5px;color:var(--dim)}
.ticklabels span{position:absolute;transform:translateX(-50%)}
.ticklabels .l95{color:var(--accent)}
.greset{font-family:var(--mono);font-size:10.5px;letter-spacing:.04em;color:var(--dim);margin-top:3px}
.greset .until{color:var(--fg)}
.burn{font-family:var(--mono);font-size:13px;min-height:19px}
.reauth{background:var(--inset);border:1px solid rgba(224,93,68,.35);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:8px}
.reauth label{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--crit)}
.reauth .row{display:flex;gap:8px}
.reauth input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:3px;color:var(--fg);font-family:var(--mono);font-size:13.5px;padding:8px 10px}
.reauth input::placeholder{color:var(--dim)}
.reauth small{font-size:12.5px;color:var(--dim)}
.editpanel{background:var(--inset);border:1px solid var(--line);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:7px}
.editpanel label{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.editpanel label:not(:first-child){margin-top:4px}
.editpanel input{background:var(--panel);border:1px solid var(--line);border-radius:3px;color:var(--fg);font-family:var(--mono);font-size:13.5px;padding:8px 10px}
.editpanel input::placeholder{color:var(--dim)}
.editpanel .row{display:flex;gap:8px;margin-top:4px}
.pmsg{font-family:var(--mono);font-size:12px;color:var(--crit);min-height:0}
.cardmsg{font-family:var(--mono);font-size:12px;color:var(--crit)}
.card-foot{display:flex;align-items:center;margin-top:auto;padding-top:13px;border-top:1px solid var(--line);gap:8px}
.updated{font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.acts{margin-left:auto;display:flex;align-items:center;gap:4px}
.acts button{font-family:var(--mono);font-size:14.5px;color:var(--dim);padding:5px 9px;border:1px solid transparent;border-radius:3px;transition:.15s}
.acts button:hover{color:var(--fg);border-color:var(--line);background:var(--inset)}
.acts button[aria-pressed="true"]{color:var(--accent);border-color:rgba(232,179,75,.45)}
.acts .del:hover{color:var(--crit);border-color:rgba(224,93,68,.4)}
.acts .edit-pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.05em;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:4px 12px;margin-right:4px}
.acts .edit-pill svg{flex:none}
.acts .edit-pill:hover{color:var(--accent);border-color:rgba(232,179,75,.55);background:rgba(232,179,75,.06)}
.acts .edit-pill[aria-expanded="true"]{color:var(--accent);border-color:rgba(232,179,75,.55);background:rgba(232,179,75,.06)}

/* ---------- activity ---------- */
.act-grid{display:grid;grid-template-columns:1.7fr 1fr;gap:26px}
.act-grid>div{min-width:0}
.toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}
.toolbar .lbl{font-family:var(--mono);font-size:11.5px;color:var(--dim);letter-spacing:.1em;text-transform:uppercase}
.fchip{font-family:var(--mono);font-size:12.5px;color:var(--dim);border:1px solid var(--line);border-radius:20px;padding:4px 13px;transition:.15s}
.fchip:hover{color:var(--fg);border-color:var(--dim)}
.fchip.on{color:var(--accent);border-color:rgba(232,179,75,.55);background:rgba(232,179,75,.06)}
.scrollx{overflow-x:auto}
.feedmax{max-height:620px;overflow-y:auto}
.feed{min-width:620px}
.frow{display:grid;grid-template-columns:46px 104px 82px 62px 66px 1fr;gap:11px;align-items:baseline;padding:9px 9px;border-radius:3px;font-size:13.5px;transition:background .12s}
.frow:hover{background:#1b1e1a}
.frow.head{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);border-radius:0;padding-bottom:9px}
.frow.head:hover{background:none}
.frow>span{font-family:var(--mono);font-size:13.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.frow .t{color:var(--dim)} .frow .h{color:var(--dim)} .frow .m{color:var(--dim)} .frow .tk{text-align:right;color:var(--dim)}
.frow .snip{color:var(--fg);opacity:.85;font-family:var(--sans);font-size:13.5px}
.frow.fail .snip,.frow.fail .tk,.frow.fail .m{color:var(--crit)}
.frow.fail{box-shadow:inset 2px 0 0 var(--crit);background:rgba(224,93,68,.05)}
.frow.fail:hover{background:rgba(224,93,68,.09)}
h3.sub{font-family:var(--mono);font-size:12.5px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin-bottom:13px}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);text-align:left;padding:0 9px 9px;border-bottom:1px solid var(--line);font-weight:500}
td{padding:11px 9px;border-bottom:1px solid var(--line);font-family:var(--mono);font-size:13px}
tbody tr{transition:background .12s}tbody tr:hover{background:#1b1e1a}
td.r,th.r{text-align:right}

/* ---------- provider keys ---------- */
.disclosure{width:100%;display:flex;align-items:center;gap:10px;padding:15px 18px;background:var(--panel);border:1px solid var(--line);border-radius:5px;font-size:15px;transition:.15s;text-align:left}
.disclosure:hover{border-color:var(--dim)}
.disclosure .caret{font-family:var(--mono);color:var(--accent);font-size:13px}
.disclosure .hint{margin-left:auto;font-family:var(--mono);font-size:11.5px;color:var(--dim)}
.keys-panel{margin-top:12px}
.keys-wrap{min-width:720px}
.st-ok{color:var(--ok)}.st-dead{color:var(--crit)}
.kacts{white-space:nowrap;text-align:right}
.kacts button{font-family:var(--mono);color:var(--dim);padding:3px 8px;border-radius:3px}
.kacts button:hover{color:var(--fg);background:var(--inset)}
.kacts .del:hover{color:var(--crit)}
.addform{display:flex;gap:9px;flex-wrap:wrap;margin-top:15px;padding-top:15px;border-top:1px solid var(--line);align-items:center}
.addform input{background:var(--inset);border:1px solid var(--line);border-radius:4px;color:var(--fg);font-family:var(--mono);font-size:13.5px;padding:9px 11px}
.addform input::placeholder{color:var(--dim)}
.addform .p{width:140px}.addform .l{width:160px}.addform .k{flex:1;min-width:200px}
.kmsg{font-family:var(--mono);font-size:12.5px;min-height:18px;margin-top:10px}

/* ---------- footer ---------- */
footer{border-top:1px solid var(--line)}
footer div{max-width:1240px;margin:0 auto;padding:22px 24px 30px;font-family:var(--mono);font-size:12.5px;color:var(--dim)}

@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}

/* ---------- Vue transitions / skeleton (new — build-contract §5.2) ---------- */
[v-cloak]{display:none}
.card-move{transition:transform .35s cubic-bezier(.34,1.56,.64,1)}
.card-enter-active{transition:opacity .3s ease,transform .3s cubic-bezier(.34,1.56,.64,1)}
.card-leave-active{transition:opacity .18s ease,transform .18s ease;position:absolute}
.card-enter-from{opacity:0;transform:translateY(10px) scale(.97)}
.card-leave-to{opacity:0;transform:scale(.96)}
.feed-move{transition:transform .25s ease}
.feed-enter-active{transition:opacity .25s ease,transform .25s ease}
.feed-leave-active{transition:opacity .15s ease;position:absolute}
.feed-enter-from{opacity:0;transform:translateY(-6px)}
.feed-leave-to{opacity:0}
.inbox-move{transition:transform .25s ease}
.inbox-enter-active{transition:opacity .22s ease,transform .22s cubic-bezier(.34,1.56,.64,1)}
.inbox-leave-active{transition:opacity .18s ease,transform .18s ease,max-height .22s ease,margin .22s ease,padding .22s ease;position:relative;overflow:hidden}
.inbox-enter-from{opacity:0;transform:translateX(-14px)}
.inbox-leave-to{opacity:0;transform:translateX(14px);max-height:0;margin-bottom:0;padding-top:0;padding-bottom:0}
.panel-enter-active,.panel-leave-active{transition:max-height .28s ease,opacity .2s ease;overflow:hidden}
.panel-enter-from,.panel-leave-to{max-height:0;opacity:0}
.panel-enter-to,.panel-leave-from{max-height:400px;opacity:1}
.banner-enter-active,.banner-leave-active{transition:transform .25s ease,opacity .2s ease}
.banner-enter-from,.banner-leave-to{transform:translateY(-100%);opacity:0}
.spark svg polyline{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .6s ease forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.skeleton{max-width:1240px;margin:0 auto;padding:38px 24px}
.sk-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,380px),1fr));gap:16px;margin-bottom:16px}
.sk-card{height:190px;border-radius:6px;background:var(--panel);border:1px solid var(--line);
  background-image:linear-gradient(100deg,var(--panel) 30%,#20241f 50%,var(--panel) 70%);
  background-size:200% 100%;animation:shimmer 1.6s ease-in-out infinite}
@keyframes shimmer{from{background-position:130% 0}to{background-position:-30% 0}}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}
  .spark svg polyline{stroke-dashoffset:0}   /* draw-in cut → show the full line, not a blank one */
}
@media (max-width:980px){.act-grid{grid-template-columns:1fr}}
@media (max-width:760px){.rollup{display:none}.hwrap{gap:12px;padding-top:8px;padding-bottom:8px}}
@media (max-width:420px){main{padding:0 14px}.hwrap{padding:0 14px}.hero-num{font-size:34px}.spark{width:100px}}
</style>
</head>
<body>

<div id="app" v-cloak>

<!-- ============ login overlay — #login / #loginmsg ids are load-bearing CSS (spec-css.md) ============ -->
<div id="login" v-if="!authed">
  <form class="login-card" @submit.prevent="doLogin">
    <div class="logo"><span>🛡</span>AIGATE</div>
    <label for="tok">Master password</label>
    <input id="tok" ref="tok" v-model="loginPw" type="password" placeholder="master password" autocomplete="current-password" autofocus>
    <div class="hint">signs you in and stays signed in on this browser</div>
    <button class="btn accent" type="submit" style="align-self:flex-start">Sign in</button>
    <div id="loginmsg" role="alert">{{ loginMsg }}</div>
  </form>
</div>

<!-- ============ header — MUST stay a <header> element (header{} CSS selector keys off the tag) ============ -->
<header ref="hdr" tabindex="-1" v-if="authed">
  <div class="hwrap">
    <div class="logo"><span>🛡</span>AIGATE</div>
    <div class="live" :class="{off:!live}" role="status"><i></i><span>{{ liveLabel }}</span></div>
    <div class="rollup">{{ rollupText }}<template v-if="polledText"> · polled <span>{{ polledText }}</span></template></div>
    <div class="clock num" aria-hidden="true">{{ clockText }}</div>
    <a class="btn" href="/board.html" title="task board">🗂 board</a>
    <button class="btn" @click="toggleBell" :aria-pressed="String(notifyOn)"
            :aria-label="notifyOn?'disable browser notifications':'enable browser notifications'"
            :title="notifyOn?'notifications on':'browser notifications'">🔔</button>
    <button class="btn" @click="doLogout">log out</button>
  </div>
</header>

<!-- ============ critical banner — flare spec §7 ============ -->
<Transition name="banner">
  <div class="banner" v-if="showBanner">
    <div><b>CRITICAL</b><span>0 accounts selectable — every account is parked, disabled, or needs re-auth. Requests are failing.</span></div>
  </div>
</Transition>

<!-- ============ ONE Suspense boundary, always mounted (never v-if'd) — contract §3/§11 ============ -->
<Suspense>
 <template #default>
  <!-- <dashboard-body> is registered in JS (CORE) as {template:'<slot></slot>', async setup(){await bootGate}} —
       a bare pass-through so Suspense can await bootGate without forking accounts/keys into a second store (D1).
       Everything inside resolves against the ROOT's data/computed/methods, unchanged. -->
  <dashboard-body>
   <!-- MUST stay a <main> element (main{} CSS selector). No id — #app already owns the Vue mount point. -->
   <main v-if="authed">

    <!-- 01 · action-required inbox — section:first-child{border-top:0} still applies; v-if REMOVES the node when empty -->
    <section v-if="inbox.length">
      <div class="sec-head"><span class="sec-num">01</span><h2>Action required</h2>
        <span class="sec-note">{{ inbox.length }} open</span></div>
      <TransitionGroup name="inbox" tag="div" id="inbox">
        <div v-for="it in inbox" :key="it.id" class="inbox-row" :class="{'warn-row':it.warn}">
          <p><template v-for="(p,i) in it.parts" :key="i"><b v-if="p.t==='b'">{{ p.s }}</b><code v-else-if="p.t==='code'">{{ p.s }}</code><template v-else>{{ p.s }}</template></template></p>
          <!-- copiedId (not a shared boolean) → each row's button state is independent (critique §1) -->
          <button v-if="it.copy" class="btn sm" @click="copyCmd(it.id)">{{ copiedId===it.id?'copied':'copy cmd' }}</button>
          <button class="x" @click="dismiss(it.id)" aria-label="dismiss">✕</button>
        </div>
      </TransitionGroup>
    </section>

    <!-- 02 · account cards -->

 <template #fallback>

<!-- footer div{} is a COMPOUND CSS selector — the direct <div> child is load-bearing (spec-css.md) -->
<footer v-if="authed"><div>{{ footText }}</div></footer>

</div>

<script src="/vue.global.prod.js"></script>
<script>
'use strict';
/* ================================================================
   aigate dashboard — Vue 3 (Options API, in-DOM template, no build step)
   ================================================================ */

/* ---------------- pure helpers (verbatim from the vanilla build) ---------------- */
const fmtAge=s=>s<60?Math.max(0,Math.round(s))+'s':s<3600?Math.floor(s/60)+'m':s<86400?Math.floor(s/3600)+'h':Math.floor(s/86400)+'d';
// sqlite timestamps are bare UTC ("2026-07-11 18:30:00", no Z) — V8 parses those as LOCAL; stamp them UTC. ISO-Z (live WS rows) passes through.
const toDate=s=>new Date(/[TZ]/.test(String(s))?s:String(s).replace(' ','T')+'Z');
const fmtNum=n=>{n=Number(n)||0;return n>=1e6?(n/1e6).toFixed(2)+'M':n.toLocaleString('en-US')};
const hhmm=d=>String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
const fmtUntil=ms=>{if(ms<=0)return'now';const s=Math.round(ms/1000);
  if(s<3600)return'in '+Math.max(1,Math.round(s/60))+'m';
  if(s<86400){const h=Math.floor(s/3600),m=Math.round(s%3600/60);return'in '+h+'h'+(m?' '+m+'m':'');}
  const d=Math.floor(s/86400),h=Math.round(s%86400/3600);return'in '+d+'d'+(h?' '+h+'h':'');};
const wkhhmm=d=>d.toLocaleDateString([],{weekday:'short'})+' '+hhmm(d);
// selection cutoff is env-configurable SERVER-side (AIGATE_CUTOFF); the dashboard hardcodes the shipped default 95.
const CUTOFF=95;
const STALE_S=1500;            // >25min without a usage poll → stale
const worstOf=a=>Math.max(a.five_hour_pct||0,a.seven_day_pct||0);
const hcls=v=>v>=95?'crit':v>=80?'warn':'ok';              // hero / text threshold color
const fcls=v=>v>=95?'crit':v>=80?'warn':v>=50?'neu':'ok';  // gauge fill color
const eligible=a=>!a.disabled&&!a.reauth_needed&&a.has_token&&!a.parked&&worstOf(a)<CUTOFF;

/* ---------------- module-scope, non-reactive state ---------------- */
let TOKEN=localStorage.aigate_token||'';   // bearer for machine use; the session cookie is the real auth
let feedSeq=0;                             // monotonic feed row key source — ts collides at sqlite's 1s granularity
let bootResolve;
const bootGate=new Promise(r=>{bootResolve=r;});   // resolved as boot()'s last step; gates the Suspense boundary

/* ---------------- api plumbing (verbatim from the vanilla build) ---------------- */
// cookie-first: the session cookie (set by /api/login) auths the browser, so send it
// with credentials and only add a Bearer header if a raw token was pasted (machine use).
async function api(path){const r=await fetch(path,{credentials:'same-origin',headers:TOKEN?{authorization:'Bearer '+TOKEN}:{}});if(r.status===401||r.status===429)throw r.status;return r.json();}
// mutation helper — returns {status,ok,body} so callers can branch on 400/404/409/502; never throws.
async function send(method,path,body){
  const headers={'content-type':'application/json'};if(TOKEN)headers.authorization='Bearer '+TOKEN;
  const r=await fetch(path,{method,credentials:'same-origin',headers,body:body===undefined?undefined:JSON.stringify(body)});
  const j=await r.json().catch(()=>({}));
  return {status:r.status,ok:r.ok,body:j};
}

// the ONE async-setup child. Its whole job is to suspend the Suspense boundary until boot()'s
// first /api/stats lands. Slot content is compiled in the ROOT's scope, so every data/computed/
// method referenced inside it is the root's — no props, no second store (D1).
const DashboardBody={ template:'<slot></slot>', async setup(){ await bootGate; } };

const app=Vue.createApp({
  data(){return{
    /* ---- session + header chrome ---- */
    authed:false,            // false until /api/stats returns 200 → gates header/main/footer, shows #login
    loginPw:'',              // v-model on the master-password input
    loginMsg:'',             // #loginmsg text
    live:false,              // WS open → .live loses .off
    liveLabel:'offline',     // 'offline' before first connect, then 'live' / 'reconnecting'
    now:Date.now(),          // THE single reactive clock — one setInterval writes this, nothing else
    version:'',              // from /api/capabilities → footer
    notifyOn:false,          // bell toggle
    runFlash:false,          // ⚠ in document.title until any pointerdown/keydown

    /* ---- server state ---- */
    accounts:[],             // /api/stats.accounts  |  WS 'accounts'
    keys:[],                 // /api/keys            |  WS 'keys'
    hosts:[],                // /api/stats.by_host
    hosts1h:[],              // /api/stats.by_host_1h
    providers:[],            // /api/providers → <datalist>
    acctsAt:0,                // ms epoch when `accounts` last arrived (ages usage_age_s)

    /* ---- per-account history + card UI ---- */
    rings:{},                // account -> [{t,v}]  worst-% ring buffer, CAP 40, FIFO
    heroShown:{},             // account -> integer currently painted in .hero-num (rAF tween writes here)
    refreshing:{},            // account -> true while POST …/refresh is in flight (disables ↻)
    cardMsgs:{},               // account -> [data-cmsg] inline error string ('' = hidden)
    editState:null,            // {account,name,label,tok} | null   (NO `focus` field — see D6)
    editMsg:'',                // .editpanel [data-emsg] error ('' = hidden)
    reauthDrafts:{},           // account -> pasted setup-token (v-model target)
    reauthMsgs:{},             // account -> .reauth [data-rmsg] error ('' = hidden)
    dismissed:{},               // inbox item id -> true (session only, never persisted)
    copiedId:null,               // inbox item id whose copy button currently reads 'copied'

    /* ---- activity feed ---- */
    feed:[],                  // newest-first rows {key,kind,ts,account,host,model,tokens,text,fail}; CAP 200
    paused:false,
    queue:[],                  // [{d,kind}] held while paused
    seenAccounts:{},            // name -> true   (chip source)
    seenHosts:{},                // name -> true   (chip source)
    fAccounts:{},                 // name -> true   (ACTIVE account filter)
    fHosts:{},                     // name -> true   (ACTIVE host filter)
    seeding:false,                  // true during seedFeed() → suppresses pendingLive
    pendingLive:0,
    lastLiveNote:0,
    liveNote:'',                     // #livenote aria-live text

    /* ---- provider keys ---- */
    keysOpen:false,
    kmsg:'', kmsgColor:'',            // #kmsg text + inline color ('var(--ok)' | 'var(--crit)' | 'var(--dim)')
    kprov:'', klabel:'', kkey:'',      // add-key form fields

    /* ---- private bookkeeping, never rendered ---- */
    _prevWorst:{},                       // account -> previous worst% (79→80 runaway edge)
    _heroRaf:{},                          // account -> requestAnimationFrame handle (so a re-trigger cancels the old tween)
  }},
  computed:{
    /* ================= CORE (§2.1) ================= */
    selectableCount(){ return this.accounts.filter(eligible).length; },
    parkedCount(){ return this.accounts.filter(a=>a.parked&&!a.disabled).length; },
    reauthCount(){ return this.accounts.filter(a=>a.reauth_needed).length; },
    keysWorking(){ return this.keys.filter(k=>k.status==='working').length; },
    keysDead(){ return this.keys.filter(k=>k.status==='dead').length; },
    // null when no account has ever reported a poll age; drives polledText and re-ticks off `now` via curAge
    minAge(){
      const ages=this.accounts.map(a=>this.curAge(a)).filter(x=>x!=null);
      return ages.length?Math.min(...ages):null;
    },
    rollupText(){
      const n=this.accounts.length,sel=this.selectableCount,parked=this.parkedCount,reauth=this.reauthCount;
      let r=n?sel+'/'+n+' selectable · '+parked+' parked · '+reauth+' re-auth':'no accounts yet';
      if(this.keys.length)r+=' · keys '+this.keysWorking+'✓ '+this.keysDead+'✗';
      return r;
    },
    polledText(){ return this.minAge==null?'':fmtAge(this.minAge)+' ago'; },
    showBanner(){ return this.accounts.length>0&&this.selectableCount===0; },
    // 01 · action-required inbox items — order: per-account reauth, per-account stale, then dead keys.
    // `parts` (not a template string) so the template renders real <b>/<code> nodes — no v-html, no esc().
    inbox(){
      const items=[];
      for(const a of this.accounts){
        if(a.reauth_needed&&!this.dismissed['reauth:'+a.account]){
          items.push({id:'reauth:'+a.account,warn:false,copy:true,parts:[
            {t:'b',s:a.account},
            {t:'x',s:' needs re-auth — run '},
            {t:'code',s:'claude setup-token'},
            {t:'x',s:', then paste the new token on its card'},
          ]});
        }
        const age=this.curAge(a);
        if(!a.reauth_needed&&age!=null&&age>STALE_S&&!this.dismissed['stale:'+a.account]){
          items.push({id:'stale:'+a.account,warn:true,copy:false,parts:[
            {t:'b',s:a.account},
            {t:'x',s:" hasn't reported usage in "+fmtAge(age)+" — poll may be failing"},
          ]});
        }
      }
      for(const k of this.keys){
        if(k.status==='dead'&&!this.dismissed['deadkey:'+k.id]){
          items.push({id:'deadkey:'+k.id,warn:false,copy:false,parts:[
            {t:'x',s:'provider key '},
            {t:'b',s:"'"+k.provider+(k.label?' · '+k.label:'')+"'"},
            {t:'x',s:' is dead — last check failed'},
          ]});
        }
      }
      return items;
    },
    footText(){ return 'aigate'+(this.version?' v'+this.version:'')+' · 30-day log retention'; },
    // reads `this.now` (not Date.now()) so the 1s tick repaints it — same trick as curAge
    clockText(){ return new Date(this.now).toTimeString().slice(0,8); },
    titleText(){ return (this.runFlash?'⚠ ':'')+(this.inbox.length?'('+this.inbox.length+') ':'')+'aigate'; },

    /* ================= CARDS (§2.2) ================= */
    // re-sort every time accounts/curAge change; severity first, worst% breaks ties within a rank
    sortedAccounts(){
      return [...this.accounts].sort((x,y)=>this.sevRank(x)-this.sevRank(y)||this.worstOf(y)-this.worstOf(x));
    },
    // the single eligible account with the lowest worst% — who the selector will hand out next
    nextPickName(){
      const pick=this.sortedAccounts.filter(this.eligible).sort((x,y)=>this.worstOf(x)-this.worstOf(y))[0];
      return pick?pick.account:null;
    },

    /* ================= FEED (§2.3) ================= */
    feedRows(){
      // filters AND together; an empty filter object (no keys) passes everything for that dimension
      return this.feed.filter(r =>
        (!this.anyAcctFilter || this.fAccounts[r.account]) &&
        (!this.anyHostFilter || this.fHosts[r.host]));
    },
    anyAcctFilter(){ return Object.keys(this.fAccounts).length>0; },
    anyHostFilter(){ return Object.keys(this.fHosts).length>0; },
    anyFilter(){ return this.anyAcctFilter || this.anyHostFilter; },
    feedFails(){ return this.feedRows.filter(r=>r.fail).length; },
    feedNote(){
      // section-note text: blank when empty, fail-count takes priority over the plain row count
      const rows = this.feedRows, fails = this.feedFails;
      if(!rows.length) return '';
      return fails ? fails+' failed in view' : rows.length+' rows';
    },
    acctChips(){ return Object.keys(this.seenAccounts).sort(); },
    hostChips(){ return Object.keys(this.seenHosts).sort(); },
    hostRows(){
      return this.hosts.map(h=>{
        const ts = h.last ? +toDate(h.last) : null;
        const age = ts ? (this.now-ts)/1000 : null;   // this.now, not Date.now() — re-ticks every second off startClock's interval
        // tps join quirk preserved VERBATIM from the original: by_host_1h is keyed by the SHORT
        // hostname (first dot-segment) even when by_host itself carries an FQDN. Not a bug — do not "fix" it.
        const r1h = this.hosts1h.find(x=>x.host===(h.host||'').split('.')[0]);
        return {
          host: h.host||'—',
          requests: fmtNum(h.requests),
          tokens: fmtNum(h.tokens),
          age,
          stale: age!=null && age>STALE_S,
          ageText: ts ? fmtAge(age)+' ago' : '—',
          tps: r1h ? r1h.tps : '—',
        };
      });
    },

    /* ================= KEYS (§2.4) ================= */
    keysTitle(){ return 'Provider API keys · '+this.keys.length; },
    khint(){
      const p=this.providers.find(x=>x.id===this.kprov.trim());
      return p?(p.prefix?'↳ '+p.name+' — keys usually start "'+p.prefix+'"':'↳ '+p.name):(this.kprov.trim()?'↳ custom provider':'');
    },
    // must depend on this.now (via relTime) so the table re-ticks every second
    keyRows(){
      return this.keys.map(k=>({...k,
        stCls:k.status==='working'?'st-ok':k.status==='dead'?'st-dead':'dim',
        created:this.relTime(k.created_at,'—'),
        used:k.last_used?this.relTime(k.last_used,'—'):null,
        checked:this.relTime(k.last_checked,'—'),
      }));
    },
  },
  watch:{
    titleText:{ immediate:true, handler(v){ document.title=v; } },
  },
  methods:{
    /* ================= CORE (§2.1) ================= */
    // re-exported module helpers so markup can call fmtAge(...)/worstOf(...)/etc without a `this.` prefix —
    // Vue resolves bare template identifiers against the instance, and a shorthand method IS an instance method.
    fmtAge, fmtNum, fmtUntil, hhmm, wkhhmm, worstOf, hcls, fcls, eligible, toDate,

    kick(){ localStorage.removeItem('aigate_token'); location.reload(); },

    async doLogin(){
      if(!this.loginPw){ this.loginMsg='enter the master password'; return; }
      this.loginMsg='signing in…';
      const r=await send('POST','/api/login',{password:this.loginPw});
      if(r.status===200){ this.loginPw=''; TOKEN=''; localStorage.removeItem('aigate_token'); this.loginMsg=''; this.boot(); }
      else if(r.status===401) this.loginMsg='wrong password — try again';
      else if(r.status===429) this.loginMsg='too many attempts — locked out, try later';
      else if(r.status===400) this.loginMsg='password login is not enabled on the server';
      else this.loginMsg="can't reach server — try again";
    },

    async doLogout(){
      try{ await send('POST','/api/logout'); }catch(_){}
      localStorage.removeItem('aigate_token'); TOKEN=''; location.reload();
    },

    async boot(){
      let s;
      try{ s=await api('/api/stats'); }
      catch(e){
        if(e===401){
          TOKEN=''; localStorage.removeItem('aigate_token'); this.authed=false;
          this.$nextTick(()=>this.$refs.tok&&this.$refs.tok.focus());
          return;
        }
        if(e===429){ this.loginMsg='too many auth failures — locked out, try later'; return; }
        this.loginMsg="can't reach server, retrying…";
        setTimeout(this.boot,3000);
        return;
      }
      this.ingestStats(s);
      this.authed=true;
      try{ await this.loadProviders(); this.keys=await api('/api/keys'); }
      catch(e){ if(e===401) return this.kick(); }
      this.seeding=true; this.feed=[];
      try{ await this.seedFeed(); }
      catch(e){ if(e===401) return this.kick(); }
      this.seeding=false;
      api('/api/capabilities').then(c=>{ this.version=c.version||''; }).catch(()=>{});   // fire-and-forget, never blocks boot
      this.connect();
      this.startClock();
      bootResolve();   // releases the Suspense boundary — DashboardBody's setup() was awaiting this
      this.$nextTick(()=>this.$refs.hdr&&this.$refs.hdr.focus({preventScroll:true}));
    },

    connect(){
      if(this._ws&&(this._ws.readyState===0||this._ws.readyState===1))return;   // already CONNECTING/OPEN — no duplicate socket
      this._ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws',TOKEN?['aigate','bearer.'+TOKEN]:['aigate']);
      this._ws.onopen=async()=>{
        this.live=true; this.liveLabel='live';
        try{
          const s=await api('/api/stats'); this.ingestStats(s);
          this.keys=await api('/api/keys');
          this.seeding=true; this.feed=[]; await this.seedFeed(); this.seeding=false;
        }catch(e){ this.seeding=false; if(e===401)this.kick(); }
      };
      this._ws.onclose=()=>{ this.live=false; this.liveLabel='reconnecting'; setTimeout(this.connect,2000); };
      this._ws.onmessage=e=>{
        let m; try{ m=JSON.parse(e.data); }catch{ return; }   // malformed frame — drop it, don't kill the handler (D9)
        if(m.type==='accounts') this.ingestAccounts(m.data);
        else if(m.type==='keys') this.keys=m.data||[];
        else if(m.type==='prompt'){
          this.feedEvent(m.data,'prompt');
          clearTimeout(this._statsT);
          this._statsT=setTimeout(()=>api('/api/stats').then(s=>{ this.hosts=s.by_host||[]; this.hosts1h=s.by_host_1h||[]; }).catch(()=>{}),1500);
        }
        else if(m.type==='access') this.feedEvent(m.data,'access');
        // anything else — ignored
      };
    },

    ingestStats(s){
      this.accounts=s.accounts||[]; this.acctsAt=Date.now(); this.hosts=s.by_host||[]; this.hosts1h=s.by_host_1h||[];
      for(const a of this.accounts) if(!this.rings[a.account]) this.rings[a.account]=[{t:this.now,v:worstOf(a)}];   // seed once, never on later calls
      this.detectTransitions();
      this.syncHero();
    },

    ingestAccounts(list){
      this.accounts=list||[]; this.acctsAt=Date.now();
      for(const a of this.accounts){
        const r=this.rings[a.account]||(this.rings[a.account]=[]);
        r.push({t:this.now,v:worstOf(a)}); if(r.length>40)r.shift();   // 40-point FIFO ring
      }
      this.detectTransitions();
      this.syncHero();
    },

    // 79→80 runaway edge → title flash + (gated) Notification
    detectTransitions(){
      for(const a of this.accounts){
        const w=worstOf(a),prev=this._prevWorst[a.account];
        if(prev!==undefined&&prev<80&&w>=80){
          this.runFlash=true;
          if(this.notifyOn&&'Notification'in window&&Notification.permission==='granted'){
            try{ new Notification('aigate — runaway account',{body:a.account+' hit '+Math.round(w)+'% of its worst window'}); }catch(_){}
          }
        }
        this._prevWorst[a.account]=w;
      }
    },

    // drives the reactive hero number: unchanged accounts snap in place, changed ones hand off to tweenHero
    syncHero(){
      const seen={};
      for(const a of this.accounts){
        seen[a.account]=true;
        const w=Math.round(worstOf(a)),from=this.heroShown[a.account];
        if(from===undefined) this.heroShown[a.account]=w;
        else if(from!==w) this.tweenHero(a.account,from,w);
      }
      for(const name of Object.keys(this.heroShown)){   // prune accounts that dropped out (deleted/renamed)
        if(!seen[name]){ cancelAnimationFrame(this._heroRaf[name]); delete this._heroRaf[name]; delete this.heroShown[name]; }
      }
    },

    // the ONLY requestAnimationFrame in the file — re-checks reducedMotion() on every call (D10), not once at boot
    tweenHero(name,from,to,ms=550){
      cancelAnimationFrame(this._heroRaf[name]);
      if(this.reducedMotion()||from==null||to==null){ this.heroShown[name]=to; return; }
      const start=performance.now(),ease=t=>1-Math.pow(1-t,3);
      const step=now=>{
        const t=Math.min(1,(now-start)/ms);
        this.heroShown[name]=Math.round(from+(to-from)*ease(t));
        if(t<1) this._heroRaf[name]=requestAnimationFrame(step);
      };
      this._heroRaf[name]=requestAnimationFrame(step);
    },

    // deliberately a method, not a computed — matchMedia can flip mid-session and every tween trigger must see it fresh
    reducedMotion(){ return matchMedia('(prefers-reduced-motion: reduce)').matches; },

    // usage_age_s is relative to when the server captured it; age it forward using the reactive clock (`this.now`,
    // not Date.now()) so every consumer (cards, inbox, rollup) re-computes on the 1s tick without its own interval
    curAge(a){ return a.usage_age_s==null?null:a.usage_age_s+(this.now-this.acctsAt)/1000; },

    // the ONE setInterval in the file — writes `this.now` and throttles the "N new events" live-region note to 5s
    startClock(){
      if(this._tick)return;
      this._tick=setInterval(()=>{
        this.now=Date.now();
        if(this.pendingLive>0&&this.now-this.lastLiveNote>=5000){
          this.liveNote=this.pendingLive+' new event'+(this.pendingLive===1?'':'s');
          this.pendingLive=0; this.lastLiveNote=this.now;
        }
      },1000);
    },

    async toggleBell(){
      if(!('Notification'in window))return;   // unsupported — template's static :title already covers it, nothing to flip
      if(this.notifyOn){ this.notifyOn=false; return; }
      if(Notification.permission==='granted'){ this.notifyOn=true; return; }
      if(Notification.permission==='denied')return;   // blocked — stays off
      try{ this.notifyOn=(await Notification.requestPermission())==='granted'; }catch(_){ this.notifyOn=false; }
    },

    clearFlash(){ if(this.runFlash)this.runFlash=false; },

    dismiss(id){ this.dismissed[id]=true; },

    copyCmd(id){
      try{ navigator.clipboard&&navigator.clipboard.writeText('claude setup-token'); }catch(_){}
      this.copiedId=id;
      clearTimeout(this._copyT);
      this._copyT=setTimeout(()=>{ if(this.copiedId===id)this.copiedId=null; },1200);   // per-row, not a shared flag (critique §1)
    },

    /* ================= CARDS (§2.2) ================= */
    // severity ladder: re-auth first (polling is dead), runaway next (burning budget right now),
    // then everything else roughly in "needs attention" order. Lower number sorts first.
    sevRank(a){
      const w=this.worstOf(a),age=this.curAge(a);
      if(a.reauth_needed)return 0;
      if(w>=80)return 1;
      if(!a.has_token)return 2;
      if(age!=null&&age>STALE_S)return 3;
      if(!a.disabled&&!a.parked)return 4;
      if(a.parked&&!a.disabled)return 5;
      return 6;
    },
    chipOf(a){
      const w=this.worstOf(a);
      if(a.disabled)return{t:'DISABLED',c:'dim'};
      if(a.reauth_needed)return{t:'RE-AUTH',c:'crit'};
      if(a.parked)return{t:'PARKED'+(a.parked_until?' →'+this.hhmm(this.toDate(a.parked_until)):''),c:'dim'};
      if(!a.has_token)return{t:'NO TOKEN',c:'warn'};
      if(w>=80)return{t:'RUNAWAY',c:'warn'};
      return{t:'READY',c:'ok'};
    },
    // null hides the whole .greset line; `this.now` in the `until` calc is what makes the
    // countdown re-tick every second without a data-until/DOM-walk hack (D4)
    gaugeReset(sec){
      if(!sec)return null;
      return{when:this.wkhhmm(new Date(sec*1000)),until:this.fmtUntil(sec*1000-this.now)};
    },
    // SVG polyline points for the worst-% ring buffer. '' (no polyline), a flat 2-point line for
    // a single sample, or the full normalized path — x spans 0..110, y spans 30..0 (100%→y=0).
    sparkPoints(name){
      const s=this.rings[name]||[];
      if(s.length===0)return'';
      if(s.length===1){const y=30-Math.min(100,Math.max(0,s[0].v))/100*30;return'0,'+y+' 110,'+y;}
      return s.map((p,i)=>{
        const x=(i/(s.length-1)*110).toFixed(1),y=(30-Math.min(100,Math.max(0,p.v))/100*30).toFixed(1);
        return x+','+y;
      }).join(' ');
    },
    sparkStroke(name){
      const s=this.rings[name]||[];
      if(!s.length)return'var(--dim)';
      const col=this.hcls(s[s.length-1].v);
      return col==='dim'?'var(--dim)':col==='ok'?'var(--ok)':col==='warn'?'var(--warn)':'var(--crit)';
    },
    // exhaustion-rate projection off the ring buffer. Returns [text, cssClass].
    burnLine(a){
      if(a.disabled)return['disabled · excluded from selection','dim'];
      if(a.reauth_needed)return['— polling paused · re-auth required','dim'];
      if(a.parked)return['parked'+(a.parked_until?' until '+this.hhmm(this.toDate(a.parked_until)):'')+' · requests routed to next account','dim'];
      const s=this.rings[a.account]||[];
      if(s.length<2)return['— collecting samples','dim'];
      const first=s[0],last=s[s.length-1],dtH=(last.t-first.t)/3600000;
      if(dtH<30/3600)return['— steady','dim'];   // window too small to rate honestly — the 30s guard
      const rate=(last.v-first.v)/dtH;
      if(rate>0.5){
        const g5=a.five_hour_pct||0;
        if(g5>=100)return['↑'+rate.toFixed(1)+'%/h · 5h window exhausted','crit'];
        const left=(100-g5)/rate;
        return['↑'+rate.toFixed(1)+'%/h · 5h window exhausts in ~'+(left>=1?Math.round(left)+'h':Math.max(1,Math.round(left*60))+'m'),g5>=80?'warn':'dim'];
      }
      if(rate<-0.5)return['↓ recovering','ok'];
      return['— steady','dim'];
    },
    // `this.now`-driven so it re-ticks every second; `stale` follows the live age, not the
    // server-stamped usage_age_s snapshot
    updatedInfo(a){
      if(a.usage_age_s===undefined)return{mode:'old',text:'updated '+(a.usage_updated||'never'),stale:false};
      if(a.usage_age_s===null)return{mode:'never',text:'never polled',stale:false};
      const age=this.curAge(a);
      return{mode:'live',text:'updated '+this.fmtAge(age)+' ago',stale:age>STALE_S};
    },
    isStale(a){
      const g=this.curAge(a);
      return g!=null&&g>STALE_S;
    },
    cardMsg(name,msg){
      if(msg)this.cardMsgs[name]=msg;else delete this.cardMsgs[name];
    },
    toggleEdit(a){
      if(this.editState&&this.editState.account===a.account){this.editState=null;}
      else{this.editState={account:a.account,name:a.account,label:a.label||'',tok:''};this.editMsg='';}
    },
    cancelEdit(){this.editState=null;this.editMsg='';},
    // reads from editState (the v-model targets), not the DOM — no querySelector-and-trim dance
    async saveEdit(a){
      const name=(this.editState.name||'').trim(),label=(this.editState.label||'').trim(),tok=(this.editState.tok||'').trim();
      this.editMsg='';
      if(!name){this.editMsg='name is required';return;}
      if(/[/\s]/.test(name)){this.editMsg='name cannot contain spaces or slashes';return;}
      const renamed=name!==a.account,relabeled=label!==(a.label||'');
      if(!renamed&&!relabeled&&!tok){this.editState=null;return;}
      try{
        if(renamed||relabeled){
          const body={};if(renamed)body.account=name;if(relabeled)body.label=label;
          const r=await send('PATCH','/api/accounts/'+encodeURIComponent(a.account),body);
          if(r.status===401)return this.kick();
          if(r.status===404&&(r.body.error==='not found'||!r.body.error)){this.editMsg='rename requires server update';return;} // pre-PATCH server
          if(!r.ok){this.editMsg=r.body.error||('HTTP '+r.status);return;}
          a.account=name;if(relabeled)a.label=label;   // apply locally; broadcast may follow
        }
        if(tok){
          const r=await send('POST','/api/accounts',{account:name,setup_token:tok,label:label});
          if(r.status===401)return this.kick();
          if(!r.ok){this.editMsg=r.body.error||('HTTP '+r.status);return;}
        }
        this.editState=null;
      }catch(_){this.editMsg='network error — try again';}
    },
    async saveReauth(a){
      const tok=(this.reauthDrafts[a.account]||'').trim();
      this.reauthMsgs[a.account]='';
      if(!tok){this.reauthMsgs[a.account]='paste the setup-token first';return;}
      try{
        const r=await send('POST','/api/accounts',{account:a.account,setup_token:tok,label:a.label||''});
        if(r.status===401)return this.kick();
        if(!r.ok){this.reauthMsgs[a.account]=r.body.error||('HTTP '+r.status);return;}  // surfaces the 400 code#state explanation
        delete this.reauthDrafts[a.account];
      }catch(_){this.reauthMsgs[a.account]='network error — try again';}
    },
    async doRefresh(a){
      this.refreshing[a.account]=true;
      this.cardMsg(a.account,'polling '+a.account+'…');
      try{
        const r=await send('POST','/api/accounts/'+encodeURIComponent(a.account)+'/refresh');
        if(r.status===401)return this.kick();
        if(r.status===502)this.cardMsg(a.account,'poll failed — '+(r.body.error||'upstream error'));  // poll failure: inline, no alarm
        else if(!r.ok)this.cardMsg(a.account,r.body.error||('HTTP '+r.status));
        else this.cardMsg(a.account,'');   // success → server broadcasts fresh accounts
      }catch(_){this.cardMsg(a.account,'network error — try again');}
      finally{delete this.refreshing[a.account];}
    },
    async doToggle(a){
      try{
        const r=await send('POST','/api/accounts/'+encodeURIComponent(a.account)+'/disabled',{disabled:!a.disabled});
        if(r.status===401)return this.kick();
        if(!r.ok)this.cardMsg(a.account,r.body.error||('HTTP '+r.status));
      }catch(_){this.cardMsg(a.account,'network error — try again');}
    },
    async doDelete(a){
      if(!confirm('Delete account "'+a.account+'"? This cannot be undone.'))return;
      try{
        const r=await send('DELETE','/api/accounts/'+encodeURIComponent(a.account));
        if(r.status===401)return this.kick();
        if(!r.ok)this.cardMsg(a.account,r.body.error||('HTTP '+r.status));
        if(this.editState&&this.editState.account===a.account)this.editState=null;
      }catch(_){this.cardMsg(a.account,'network error — try again');}
    },

    /* ================= FEED (§2.3) ================= */
    rowFrom(d,kind){
      // feedSeq is a monotonic module-level counter — the `key` it produces is the ONLY thing in
      // this object guaranteed unique. `ts` collides at sqlite's 1s granularity when several rows
      // land in the same second, and a plain array index is unstable once addRows() unshift()s new
      // rows in front of old ones — either would make :key flicker/reuse DOM nodes.
      const key = kind+'-'+(feedSeq++);
      const ts = d.ts!=null ? +toDate(d.ts) : Date.now();   // toDate() fixes the bare-UTC sqlite quirk; ISO-Z WS rows pass through
      if(kind==='access') return {
        key, kind, ts,
        account: d.account||'',    // empty-string fallback (NOT '?') — access rows with no account never become a filter chip, see addRows()
        host: d.host||'',
        model:'—', tokens:'—',
        text:'▸ '+(d.action||'')+(d.result?' — '+d.result:''),
        fail: !!(d.result && d.result!=='ok'),
      };
      // kind === 'prompt'
      return {
        key, kind, ts,
        account: d.account||'?',   // '?' fallback here, deliberately different from the access-row '' above
        host: d.host||'',
        model: d.model||'—',
        // tokens are always 0/null in this system — see CLAUDE.md; the reporting hook fires on
        // UserPromptSubmit, before the model has responded, so the real count never exists at write
        // time. Render an em-dash and never animate it. Remove this check if the hook is ever fixed.
        tokens: d.tokens!=null ? fmtNum(d.tokens) : '—',
        text: d.prompt||'',
        fail: false,
      };
    },
    feedEvent(d,kind){
      // paused rows queue as raw {d,kind} — NOT pre-converted via rowFrom() — so the eventual key/ts
      // reflect when the row actually lands in the feed (on resume), not when it arrived off the wire.
      if(this.paused){ this.queue.push({d,kind}); return; }
      this.addRows([this.rowFrom(d,kind)]);
    },
    addRows(rows){
      for(const r of rows){
        this.feed.unshift(r);
        if(this.feed.length>200) this.feed.length=200;   // hard cap — WS+poll could otherwise grow this unbounded across a long session
        // seenAccounts/seenHosts are plain {name:true} objects, not Sets (build contract §1 ruling) —
        // acctChips/hostChips read them via Object.keys().sort(), no [...set] spread needed
        if(r.account && !this.seenAccounts[r.account]) this.seenAccounts[r.account]=true;
        if(r.host && !this.seenHosts[r.host]) this.seenHosts[r.host]=true;
        // seeding=true only while seedFeed() is in flight (set by boot()/connect()) — suppresses the
        // "50 new events" flood on boot/reconnect. The throttled aria-live counter (startClock's tick,
        // owned by CORE) only speaks for rows that arrived while seeding was false.
        if(!this.seeding) this.pendingLive++;
      }
      // no buildChips()/renderFeed() call needed — acctChips/hostChips/feedRows/feedNote are all
      // computed properties, they recompute themselves the instant `feed`/`seenAccounts`/`seenHosts` change
    },
    async seedFeed(){
      const logs = await api('/api/logs?limit=50');            // 401 here propagates up to boot()/connect()'s catch — do not swallow it
      const acc = await api('/api/access?limit=50')
        .then(r=>Array.isArray(r)?r:[])
        .catch(()=>[]);                                          // older servers 404 here; best-effort, never fatal to boot
      const rows = [...logs.map(d=>this.rowFrom(d,'prompt')), ...acc.map(d=>this.rowFrom(d,'access'))]
        .sort((a,b)=>a.ts-b.ts);                                   // ascending (oldest first) so addRows' unshift() lands them newest-first
      this.addRows(rows);
    },
    togglePause(){
      this.paused = !this.paused;
      if(!this.paused && this.queue.length){
        // drain the WHOLE queue through one addRows() call — one pass of the seen-set/pendingLive
        // bookkeeping instead of N, and the feed updates in a single reactive patch instead of N re-renders
        const rows = this.queue.map(q=>this.rowFrom(q.d,q.kind));
        this.queue = [];
        this.addRows(rows);
      }
    },
    toggleChip(kind,v){
      // fAccounts/fHosts are plain objects (build contract §1) — toggling a brand-new key via
      // delete/assignment is one Vue-tracked mutation, no Vue.set ceremony needed in Vue 3.
      const set = kind==='a' ? this.fAccounts : this.fHosts;
      set[v] ? delete set[v] : set[v] = true;
    },
    clearChips(){
      this.fAccounts = {};
      this.fHosts = {};
    },

    /* ================= KEYS (§2.4) ================= */
    relTime(v,empty){ return !v?(empty||'—'):fmtAge((this.now-(+toDate(v)))/1000)+' ago'; },
    async loadProviders(){ this.providers=await api('/api/providers'); },
    toggleKeys(){ this.keysOpen=!this.keysOpen; },
    async addKey(){
      const provider=this.kprov.trim(),key=this.kkey.trim(),label=this.klabel.trim();
      if(!provider||!key){ this.kmsgColor='var(--crit)'; this.kmsg='provider + key required'; return; }
      this.kmsgColor='var(--dim)'; this.kmsg='adding…';
      try{
        const r=await send('POST','/api/keys',{provider,key,label});
        if(r.status===401)return this.kick();
        if(r.ok){ this.kmsgColor='var(--ok)'; this.kmsg='✓ added '+provider; this.kkey=''; this.klabel=''; }
        else{ this.kmsgColor='var(--crit)'; this.kmsg='✗ '+(r.body.error||('HTTP '+r.status)); }
      }catch(err){ this.kmsgColor='var(--crit)'; this.kmsg='✗ '+err; }
    },
    async delKey(k){
      if(!confirm('Delete key '+k.provider+(k.label?' · '+k.label:'')+' ('+(k.key_hint||'')+')?'))return;
      const r=await send('DELETE','/api/keys/'+k.id).catch(err=>({error:String(err)}));
      if(r.status===401)return this.kick();
      if(r.ok){ this.kmsgColor='var(--dim)'; this.kmsg='deleted'; }
      else{ this.kmsgColor='var(--crit)'; this.kmsg='✗ '+((r.body&&r.body.error)||r.error||('HTTP '+r.status)); }
    },
    async refreshKey(k){
      this.kmsgColor='var(--dim)'; this.kmsg='checking '+k.provider+'…';
      const r=await send('POST','/api/keys/'+k.id+'/refresh').catch(err=>({error:String(err)}));
      if(r.status===401)return this.kick();
      if(r.status===502){ this.kmsgColor='var(--crit)'; this.kmsg='✗ check failed — '+((r.body&&r.body.error)||'upstream error'); return; }
      if(r.ok){
        this.kmsgColor='var(--ok)';
        this.kmsg=r.body&&r.body.checked===false?'↳ no liveness probe for this provider':('✓ '+k.provider+' — '+(r.body&&r.body.alive?'working':'dead'));
      }else{ this.kmsgColor='var(--crit)'; this.kmsg='✗ '+((r.body&&r.body.error)||r.error||('HTTP '+r.status)); }
    },
  },
  directives:{
    // one-shot autofocus on the edit panel's name input when it mounts (D6 — replaces the
    // innerHTML-rebuild focus-restore hack; Vue patches in place so this only fires on genuine
    // panel open, never on a re-render that leaves the panel present). Cursor lands at end of
    // the existing value, matching the original setSelectionRange behavior.
    focus:{
      mounted(el){
        el.focus();
        el.setSelectionRange(el.value.length,el.value.length);
      }
    },
  },
  mounted(){
    this.boot();
    window.addEventListener('pointerdown',this.clearFlash,{passive:true});
    window.addEventListener('keydown',this.clearFlash,{passive:true});
  },
  unmounted(){
    clearInterval(this._tick);
    clearTimeout(this._statsT);
    clearTimeout(this._copyT);
    window.removeEventListener('pointerdown',this.clearFlash);
    window.removeEventListener('keydown',this.clearFlash);
  },
});
app.component('dashboard-body',DashboardBody);
app.mount('#app');
</script>
</body>
</html>
