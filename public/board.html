<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>aigate · board</title>
<style>
  :root{
    --bg:#0a0e14; --bg2:#0f1520; --panel:#131b28; --panel2:#182234;
    --line:#223044; --ink:#e6edf6; --dim:#8ea1ba; --faint:#5f728c;
    --todo:#6b7cff; --run:#f5a524; --done:#22c98a; --err:#ff5d6c;
    --accent:#6b7cff; --glow:0 0 0 1px var(--line), 0 8px 30px rgba(0,0,0,.45);
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{background:radial-gradient(1200px 700px at 80% -10%,#16233b 0%,var(--bg) 55%) fixed,var(--bg);
    color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;-webkit-font-smoothing:antialiased}
  a{color:var(--accent)}
  header{display:flex;align-items:center;gap:14px;padding:16px 22px;border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,rgba(24,34,52,.7),rgba(19,27,40,.4));backdrop-filter:blur(8px);position:sticky;top:0;z-index:20}
  header .brand{font-weight:800;letter-spacing:.3px;font-size:18px;display:flex;align-items:center;gap:9px}
  header .dot{width:10px;height:10px;border-radius:50%;background:var(--done);box-shadow:0 0 12px var(--done);animation:pulse 2.4s infinite}
  header .dot.off{background:var(--err);box-shadow:0 0 12px var(--err)}
  header .spacer{flex:1}
  .btn{border:1px solid var(--line);background:var(--panel2);color:var(--ink);padding:8px 14px;border-radius:10px;
    font-weight:600;cursor:pointer;transition:.16s transform,.16s box-shadow,.16s border-color}
  .btn:hover{transform:translateY(-1px);border-color:var(--accent);box-shadow:0 6px 18px rgba(107,124,255,.25)}
  .btn.primary{background:linear-gradient(135deg,#6b7cff,#8a6bff);border-color:transparent;color:#fff}
  .btn.ghost{background:transparent}
  .btn.sm{padding:5px 10px;font-size:12px;border-radius:8px}
  .btn.danger:hover{border-color:var(--err);box-shadow:0 6px 18px rgba(255,93,108,.25)}

  .board{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;padding:20px;max-width:1600px;margin:0 auto;align-items:start}
  @media(max-width:1100px){.board{grid-template-columns:repeat(2,1fr)}}
  @media(max-width:640px){.board{grid-template-columns:1fr}}
  .col{background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:16px;padding:12px;min-height:120px}
  .col h2{margin:2px 4px 12px;font-size:12px;text-transform:uppercase;letter-spacing:1.4px;color:var(--dim);display:flex;align-items:center;gap:8px}
  .col h2 .pip{width:9px;height:9px;border-radius:50%}
  .col .count{margin-left:auto;background:var(--panel2);border:1px solid var(--line);border-radius:20px;padding:1px 9px;font-size:11px;color:var(--dim)}
  .col.todo h2 .pip{background:var(--todo)} .col.running h2 .pip{background:var(--run)}
  .col.done h2 .pip{background:var(--done)} .col.error h2 .pip{background:var(--err)}

  .card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:12px 13px;margin-bottom:11px;
    box-shadow:0 2px 8px rgba(0,0,0,.25);cursor:pointer;position:relative;overflow:hidden}
  .card:hover{border-color:#31456a}
  .card .ttl{font-weight:700;margin-bottom:4px;display:flex;gap:8px;align-items:baseline}
  .card .id{color:var(--faint);font-size:11px;font-weight:600}
  .card .prompt{color:var(--dim);font-size:12.5px;white-space:pre-wrap;max-height:64px;overflow:hidden;
    -webkit-mask-image:linear-gradient(180deg,#000 60%,transparent);mask-image:linear-gradient(180deg,#000 60%,transparent)}
  .card .meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:9px}
  .tag{font-size:10.5px;padding:2px 8px;border-radius:20px;border:1px solid var(--line);color:var(--dim);background:var(--panel);white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis}
  .tag.model{color:#a9b6ff;border-color:#33407a} .tag.effort{color:#ffd08a;border-color:#5a4a2a}
  .tag.dir{color:#8fe3c0;border-color:#2c5344}
  .card.running{border-color:var(--run)}
  .card.running::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 30%,rgba(245,165,36,.10) 50%,transparent 70%);
    background-size:200% 100%;animation:shimmer 1.4s linear infinite;pointer-events:none}
  .card.error{border-color:#5a2730}
  .card .spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(245,165,36,.35);border-top-color:var(--run);border-radius:50%;animation:spin .7s linear infinite;vertical-align:-1px}

  .summary{margin-top:10px;border-top:1px dashed var(--line);padding-top:9px;font-size:12.5px;color:var(--ink);white-space:pre-wrap}
  .errbox{margin-top:9px;color:var(--err);font-size:12px;white-space:pre-wrap}
  .followrow{margin-top:10px;display:flex;gap:7px}
  .followrow input{flex:1;background:var(--bg2);border:1px solid var(--line);border-radius:9px;color:var(--ink);padding:7px 9px;font:inherit;font-size:12.5px}
  .followrow input:focus{outline:none;border-color:var(--accent)}
  .cardacts{margin-top:9px;display:flex;gap:6px;flex-wrap:wrap}

  /* modal */
  .scrim{position:fixed;inset:0;background:rgba(4,7,12,.62);backdrop-filter:blur(6px);display:flex;align-items:flex-start;justify-content:center;padding:7vh 16px;z-index:40}
  .modal{width:min(560px,100%);background:linear-gradient(180deg,var(--panel),var(--bg2));border:1px solid var(--line);border-radius:18px;box-shadow:var(--glow);padding:20px}
  .modal h3{margin:0 0 14px;font-size:17px}
  .field{margin-bottom:13px}
  .field label{display:block;font-size:11.5px;text-transform:uppercase;letter-spacing:1px;color:var(--dim);margin-bottom:5px}
  .field input,.field textarea,.field select{width:100%;background:var(--bg2);border:1px solid var(--line);border-radius:10px;color:var(--ink);padding:10px 11px;font:inherit}
  .field textarea{min-height:110px;resize:vertical}
  .field input:focus,.field textarea:focus,.field select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(107,124,255,.18)}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .modal .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:6px}
  .msg{color:var(--err);font-size:12px;min-height:16px;margin-top:2px}

  /* transitions */
  .flip-move{transition:transform .45s cubic-bezier(.2,.8,.2,1)}
  .flip-enter-active{transition:all .4s cubic-bezier(.2,.8,.2,1)}
  .flip-leave-active{transition:all .3s ease;position:absolute;width:calc(100% - 24px)}
  .flip-enter-from{opacity:0;transform:translateY(-10px) scale(.96)}
  .flip-leave-to{opacity:0;transform:scale(.94)}
  .fade-enter-active,.fade-leave-active{transition:opacity .18s}
  .fade-enter-from,.fade-leave-to{opacity:0}
  .empty{color:var(--faint);font-size:12px;text-align:center;padding:16px 6px}

  @keyframes spin{to{transform:rotate(360deg)}}
  @keyframes shimmer{to{background-position:-200% 0}}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
</style>
</head>
<body>
<div id="app" v-cloak>
  <header>
    <div class="brand"><span class="dot" :class="{off:!live}"></span> aigate <span style="color:var(--dim);font-weight:600">board</span></div>
    <div class="spacer"></div>
    <a class="btn ghost sm" href="/">← dashboard</a>
    <button class="btn primary" @click="openNew">+ New task</button>
  </header>

  <div class="board">
    <div v-for="col in columns" :key="col.key" class="col" :class="col.key">
      <h2><span class="pip"></span>{{col.label}}<span class="count">{{cards(col.key).length}}</span></h2>
      <transition-group name="flip" tag="div" style="position:relative">
        <div v-for="c in cards(col.key)" :key="c.id" class="card" :class="c.status" @click="expand(c)">
          <div class="ttl"><span class="id">#{{c.id}}</span> {{c.title||untitled(c)}}
            <span v-if="c.status==='running'" style="margin-left:auto"><span class="spin"></span></span>
          </div>
          <div class="prompt">{{c.prompt}}</div>
          <div class="meta">
            <span v-if="c.cwd" class="tag dir" :title="c.cwd">📁 {{base(c.cwd)}}</span>
            <span class="tag model">{{c.model||'default'}}</span>
            <span class="tag effort">effort:{{c.effort||'medium'}}</span>
          </div>

          <template v-if="opened===c.id">
            <transition name="fade">
              <div>
                <div v-if="lastSummary(c)" class="summary">{{lastSummary(c)}}</div>
                <div v-if="c.status==='error'&&c.error" class="errbox">⚠ {{c.error}}</div>
                <div v-if="c.status!=='running'&&c.status!=='todo'" class="followrow" @click.stop>
                  <input v-model="followText[c.id]" placeholder="Add a follow-up prompt…" @keydown.enter="followup(c)">
                  <button class="btn sm primary" @click="followup(c)">Send</button>
                </div>
                <div class="cardacts" @click.stop>
                  <button v-if="c.status==='error'" class="btn sm" @click="retry(c)">↻ Retry</button>
                  <button class="btn sm danger" @click="del(c)">🗑 Close</button>
                  <span v-if="c.turns&&c.turns.length>1" style="color:var(--faint);font-size:11px;align-self:center">{{c.turns.length}} turns</span>
                </div>
              </div>
            </transition>
          </template>
        </div>
      </transition-group>
      <div v-if="cards(col.key).length===0" class="empty">— empty —</div>
    </div>
  </div>

  <!-- new task modal -->
  <transition name="fade">
    <div v-if="showNew" class="scrim" @click.self="showNew=false">
      <div class="modal">
        <h3>New task</h3>
        <div class="field">
          <label>Title <span style="color:var(--faint)">(optional)</span></label>
          <input v-model="form.title" placeholder="Short label for the card" @keydown.meta.enter="create">
        </div>
        <div class="field">
          <label>Directory</label>
          <input v-model="form.cwd" placeholder="/Users/you/Projects/thing  (where claude runs)">
        </div>
        <div class="field">
          <label>Prompt</label>
          <textarea v-model="form.prompt" placeholder="What should Claude do? (locked once submitted — follow up inline after it replies)"></textarea>
        </div>
        <div class="row2">
          <div class="field">
            <label>Model</label>
            <select v-model="form.model">
              <option value="">Account default</option>
              <option>claude-opus-5</option>
              <option>claude-sonnet-5</option>
              <option>claude-haiku-4-5</option>
              <option>claude-fable-5</option>
            </select>
          </div>
          <div class="field">
            <label>Effort</label>
            <select v-model="form.effort">
              <option>low</option><option>medium</option><option>high</option><option>max</option>
            </select>
          </div>
        </div>
        <div class="msg">{{formMsg}}</div>
        <div class="actions">
          <button class="btn ghost" @click="showNew=false">Cancel</button>
          <button class="btn primary" @click="create" :disabled="busy">{{busy?'Adding…':'Add to board'}}</button>
        </div>
      </div>
    </div>
  </transition>
</div>

<script src="/vue.global.prod.js"></script>
<script>
const TOKEN = localStorage.getItem('aigate_token') || '';
const AUTH = TOKEN ? {authorization:'Bearer '+TOKEN} : {};
async function api(path,opts={}){
  const r = await fetch(path,{credentials:'same-origin',...opts,
    headers:{...(opts.body?{'content-type':'application/json'}:{}),...AUTH,...(opts.headers||{})}});
  if(r.status===401){location.href='/';throw 401;}          // not logged in → dashboard login sets the cookie
  return r;
}
const { createApp } = Vue;
createApp({
  data(){return{
    all:[], live:false, showNew:false, busy:false, formMsg:'',
    opened:null, followText:{},
    form:{title:'',cwd:'',prompt:'',model:'',effort:'medium'},
    columns:[
      {key:'todo',label:'Todo'},{key:'running',label:'Running'},
      {key:'done',label:'Done'},{key:'error',label:'Error'},
    ],
  }},
  methods:{
    cards(status){return this.all.filter(c=>c.status===status)},
    base(p){return (p||'').replace(/\/+$/,'').split('/').pop()||p},
    untitled(c){return (c.prompt||'').slice(0,40)+((c.prompt||'').length>40?'…':'')},
    parseTurns(c){try{return JSON.parse(c.turns||'[]')}catch{return[]}},
    lastSummary(c){const t=this.parseTurns(c);return t.length?t[t.length-1].summary:''},
    ingest(list){ this.all = list.map(c=>({...c,turns:this.parseTurns(c)})); },
    async load(){ try{ this.ingest(await (await api('/api/board')).json()); }catch(e){} },
    expand(c){ this.opened = this.opened===c.id ? null : c.id; },
    openNew(){ this.showNew=true; this.formMsg=''; },
    async create(){
      if(!this.form.prompt.trim()){this.formMsg='prompt is required';return;}
      this.busy=true;this.formMsg='';
      try{
        const r=await api('/api/board',{method:'POST',body:JSON.stringify(this.form)});
        if(!r.ok){this.formMsg=(await r.json().catch(()=>({}))).error||'failed';this.busy=false;return;}
        this.showNew=false;this.form={title:'',cwd:this.form.cwd,prompt:'',model:this.form.model,effort:this.form.effort};
      }catch(e){this.formMsg='request failed';}
      this.busy=false;
    },
    async followup(c){
      const txt=(this.followText[c.id]||'').trim(); if(!txt)return;
      this.followText[c.id]='';
      await api('/api/board/'+c.id+'/followup',{method:'POST',body:JSON.stringify({prompt:txt})}).catch(()=>{});
    },
    async retry(c){ await api('/api/board/'+c.id+'/retry',{method:'POST'}).catch(()=>{}); },
    async del(c){ await api('/api/board/'+c.id,{method:'DELETE'}).catch(()=>{}); if(this.opened===c.id)this.opened=null; },
    connect(){
      const ws=new WebSocket((location.protocol==='https:'?'wss':'ws')+'://'+location.host+'/ws',
        TOKEN?['aigate','bearer.'+TOKEN]:['aigate']);
      ws.onopen=()=>{this.live=true;this.load();};
      ws.onclose=()=>{this.live=false;setTimeout(()=>this.connect(),2000);};
      ws.onmessage=e=>{try{const m=JSON.parse(e.data);if(m.type==='board')this.ingest(m.data);}catch{}};
    },
  },
  mounted(){ this.load(); this.connect(); },
}).mount('#app');
</script>
<style>[v-cloak]{display:none}</style>
</body>
</html>
