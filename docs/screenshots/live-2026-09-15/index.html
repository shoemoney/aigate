<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>AIGate · Live screenshots</title><link rel="stylesheet" href="../../../public/assets/fontawesome/css/all.min.css"><style>
:root{font-size:16px;color-scheme:dark;--bg:#06101d;--panel:#0b1d2c;--line:#2c4557;--fg:#ecf7fb;--muted:#a6bfcd;--mint:#67efd6}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font:20px/1.55 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}button,input,a{font:inherit}a{color:inherit;text-decoration:none}button{cursor:pointer}header{padding:28px 40px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}h1{font-size:36px;letter-spacing:-1px;margin:0}h1 i{color:var(--mint);margin-right:12px}p{color:var(--muted);margin:7px 0 0}nav,.actions,.filters{display:flex;gap:12px;flex-wrap:wrap}.button,button{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--fg);padding:10px 16px;font-size:20px;min-height:48px}.primary{background:var(--mint);color:#06201e;border-color:var(--mint)}button:hover,a.button:hover{border-color:var(--mint)}button:focus-visible,a:focus-visible{outline:3px solid var(--mint);outline-offset:4px}button[aria-pressed=true]{border-color:var(--mint);color:var(--mint);background:#163a40}.wrap{max-width:1560px;padding:32px 40px;margin:auto}.filters{margin-bottom:28px}.note{font-size:18px;margin-bottom:24px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden}.thumb{border:0;padding:0;display:block;width:100%;height:270px;border-bottom:1px solid var(--line);border-radius:0;background:#030914}.thumb img{display:block;width:100%;height:100%;object-fit:contain}.info{padding:20px}h2{font-size:24px;margin:0 0 5px}.device{font-size:18px;color:var(--muted)}.card .actions{margin-top:18px}.card .actions button,.card .actions a{font-size:18px;padding:8px 11px}.comparebar{position:sticky;bottom:20px;margin:28px auto 0;padding:18px 24px;background:#102f3eef;border:1px solid var(--mint);border-radius:16px;display:flex;gap:18px;align-items:center;justify-content:space-between;flex-wrap:wrap;box-shadow:0 15px 70px #0008}.comparebar[hidden]{display:none}.empty{padding:50px;font-size:24px;color:var(--muted)}dialog{width:calc(100vw - 40px);height:calc(100dvh - 40px);max-width:1680px;max-height:none;background:#071420;border:1px solid var(--line);border-radius:18px;color:var(--fg);padding:0}dialog::backdrop{background:#000c}.modal-head{position:sticky;top:0;background:#0b1d2c;display:flex;align-items:center;justify-content:space-between;gap:18px;padding:16px 24px;z-index:2;flex-wrap:wrap}.modal-head strong{font-size:24px}.views{padding:24px;display:grid;grid-template-columns:1fr;gap:24px;align-items:start}.views.pair{grid-template-columns:1fr 1fr}.view{min-width:0;text-align:center}.view img{max-width:100%;height:auto;display:block;margin:auto;border:1px solid var(--line)}.view .caption{margin:0 0 14px;font-size:20px}.view.mobile img{max-height:calc(100dvh - 210px);width:auto;max-width:100%}.view a{display:inline-flex;margin-top:16px}.view.desktop img{width:100%}.modal-head .actions button{font-size:18px}.hint{font-size:18px;color:var(--muted)}@media(max-width:1050px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){header{padding:22px}.wrap{padding:24px 20px}.grid{grid-template-columns:1fr}h1{font-size:30px}.thumb{height:260px}.views.pair{grid-template-columns:1fr}.modal-head{padding:15px}.views{padding:15px}dialog{width:calc(100vw - 20px);height:calc(100dvh - 20px)}.view.mobile img{max-height:none;width:100%}.comparebar{bottom:10px}.note{font-size:18px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style></head><body><header><div><h1><i class="fa-solid fa-lock" aria-hidden="true"></i>AIGate, live.</h1><p>Desktop and mobile captures from the deployed site.</p></div><nav aria-label="Screenshot actions"><a class="button" href="https://aigate.shoemoney.ai" target="_blank" rel="noopener"><i class="fa-solid fa-globe" aria-hidden="true"></i>Open live site</a><a class="button primary" href="aigate-live-screenshots.zip" download><i class="fa-solid fa-download" aria-hidden="true"></i>Download all</a></nav></header><main class="wrap"><div class="filters" aria-label="Filter screenshots"><button data-filter="All" aria-pressed="true">All screens</button><button data-filter="Desktop" aria-pressed="false"><i class="fa-solid fa-desktop" aria-hidden="true"></i>Desktop</button><button data-filter="Mobile" aria-pressed="false"><i class="fa-solid fa-mobile-screen-button" aria-hidden="true"></i>Mobile</button><button data-filter="Favorites" aria-pressed="false"><i class="fa-solid fa-heart" aria-hidden="true"></i>Favorites</button></div><p class="note">Captured from aigate.shoemoney.ai · September 15, 2026 · Original production captures; select a screen to preview or compare.</p><div class="grid" id="grid"></div><div class="comparebar" id="comparebar" hidden><span id="comparelabel"></span><div class="actions"><button id="clear"><i class="fa-solid fa-xmark" aria-hidden="true"></i>Clear</button><button class="primary" id="compare"><i class="fa-solid fa-columns" aria-hidden="true"></i>Compare selected</button></div></div></main><dialog id="viewer"><div class="modal-head"><strong id="view-title"></strong><div class="actions"><button id="modal-favorite"><i class="fa-solid fa-heart" aria-hidden="true"></i>Favorite</button><button id="close"><i class="fa-solid fa-xmark" aria-hidden="true"></i>Close preview</button></div></div><div class="views" id="views"></div></dialog><script>
const items=[{"file": "01-entry-desktop.png", "title": "Password entry", "device": "Desktop", "url": "https://aigate.shoemoney.ai/", "captured": "2026-09-16T03:11:21.950687+00:00"}, {"file": "02-entry-mobile.png", "title": "Password entry", "device": "Mobile", "url": "https://aigate.shoemoney.ai/", "captured": "2026-09-16T03:11:22.019770+00:00"}, {"file": "03-control-room-desktop.png", "title": "Control room", "device": "Desktop", "url": "https://aigate.shoemoney.ai/#overview", "captured": "2026-09-16T03:17:26.744137+00:00"}, {"file": "04-accounts-desktop.png", "title": "AI accounts", "device": "Desktop", "url": "https://aigate.shoemoney.ai/#accounts", "captured": "2026-09-16T03:17:27.545141+00:00"}, {"file": "05-api-keys-desktop.png", "title": "Provider API keys", "device": "Desktop", "url": "https://aigate.shoemoney.ai/#keys", "captured": "2026-09-16T03:19:54.213459+00:00"}, {"file": "06-activity-desktop.png", "title": "Live activity", "device": "Desktop", "url": "https://aigate.shoemoney.ai/#activity", "captured": "2026-09-16T03:19:36.625637+00:00"}, {"file": "07-task-board-desktop.png", "title": "Task board", "device": "Desktop", "url": "https://aigate.shoemoney.ai/board", "captured": "2026-09-16T03:14:11.520080+00:00"}, {"file": "08-task-board-mobile.png", "title": "Task board", "device": "Mobile", "url": "https://aigate.shoemoney.ai/board", "captured": "2026-09-16T03:14:11.563941+00:00"}, {"file": "09-control-room-mobile.png", "title": "Control room", "device": "Mobile", "url": "https://aigate.shoemoney.ai/#overview", "captured": "2026-09-16T03:17:29.615652+00:00"}];let filter='All',selected=[],current=0,favorites=[];try{favorites=JSON.parse(localStorage.getItem('aigate-live-favorites')||'[]')}catch{}const grid=document.getElementById('grid'),dialog=document.getElementById('viewer');
function render(){const rows=items.map((s,i)=>({...s,i})).filter(s=>filter==='All'||s.device===filter||filter==='Favorites'&&favorites.includes(s.file));grid.innerHTML=rows.length?rows.map(s=>`<article class="card"><button class="thumb" data-preview="${s.i}" aria-label="Preview ${s.title}, ${s.device}"><img src="${s.file}" alt="Live AIGate ${s.title}, ${s.device}" loading="lazy"></button><div class="info"><h2>${s.title}</h2><span class="device">${s.device}</span><div class="actions"><button data-favorite="${s.i}" aria-pressed="${favorites.includes(s.file)}" aria-label="Favorite ${s.title}, ${s.device}"><i class="fa-solid fa-heart" aria-hidden="true"></i>Favorite</button><button data-compare="${s.i}" aria-pressed="${selected.includes(s.i)}" aria-label="Compare ${s.title}, ${s.device}"><i class="fa-solid fa-columns" aria-hidden="true"></i>Compare</button><a class="button" href="${s.file}" download aria-label="Download ${s.title}, ${s.device}"><i class="fa-solid fa-download" aria-hidden="true"></i>PNG</a></div></div></article>`).join(''):'<p class="empty">Favorite a screenshot to collect it here.</p>';document.getElementById('comparebar').hidden=!selected.length;document.getElementById('comparelabel').textContent=selected.map(i=>items[i].title+' · '+items[i].device).join(' / ');document.getElementById('compare').disabled=selected.length!==2;}
function favorite(i){const f=items[i].file;favorites=favorites.includes(f)?favorites.filter(v=>v!==f):[...favorites,f];try{localStorage.setItem('aigate-live-favorites',JSON.stringify(favorites))}catch{}render();document.getElementById('modal-favorite').setAttribute('aria-pressed',String(favorites.includes(items[current].file)));}
function preview(indices){current=indices[0];document.getElementById('view-title').textContent=indices.length===2?'Side-by-side comparison':items[current].title+' · '+items[current].device;const views=document.getElementById('views');views.className='views'+(indices.length===2?' pair':'');views.innerHTML=indices.map(i=>`<div class="view ${items[i].device.toLowerCase()}"><p class="caption">${items[i].title} · ${items[i].device}</p><img src="${items[i].file}" alt="${items[i].title}, ${items[i].device}"><a class="button" href="${items[i].file}" download><i class="fa-solid fa-download" aria-hidden="true"></i>Download PNG</a></div>`).join('');document.getElementById('modal-favorite').hidden=indices.length===2;document.getElementById('modal-favorite').setAttribute('aria-pressed',String(favorites.includes(items[current].file)));dialog.showModal();}
grid.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.preview!==undefined)preview([+b.dataset.preview]);if(b.dataset.favorite!==undefined)favorite(+b.dataset.favorite);if(b.dataset.compare!==undefined){const i=+b.dataset.compare;selected=selected.includes(i)?selected.filter(x=>x!==i):selected.length<2?[...selected,i]:[selected[1],i];render();}});document.querySelector('.filters').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.setAttribute('aria-pressed',String(x===b)));render();});document.getElementById('compare').onclick=()=>preview(selected);document.getElementById('clear').onclick=()=>{selected=[];render()};document.getElementById('close').onclick=()=>dialog.close();document.getElementById('modal-favorite').onclick=()=>favorite(current);dialog.addEventListener('click',e=>{if(e.target===dialog){const r=dialog.getBoundingClientRect();if(e.clientX<r.left||e.clientX>r.right||e.clientY<r.top||e.clientY>r.bottom)dialog.close()}});render();
</script></body></html>
